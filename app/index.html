<html lang="en-GB">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#6C4AE2"/>
<title>LittleNest</title>
<link rel="manifest" href="manifest.json"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>

<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Nunito:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F1FB; --bg2:#FBF9FE; --card:#fff; --ink:#241B33; --ink2:#3A3147;
  --sub:#7E7591; --faint:#A79FB8;
  --violet:#6C4AE2; --vd:#5436C4; --vl:#8A6FF0;
  --lilac:#EEE8FB; --lilac2:#F3EEFC; --line:#EBE4F4; --line2:#F1ECF8;
  --gold:#C99A3C; --goldbg:#FBF3DF;
  --danger:#C0455B; --green:#1A8551; --greenbg:#E7F6EE; --blue:#4E80C2;
  --sh-sm:0 1px 3px rgba(36,27,51,.06),0 1px 2px rgba(36,27,51,.04);
  --sh-md:0 4px 16px rgba(36,27,51,.08),0 1px 4px rgba(36,27,51,.04);
  --sh-lg:0 12px 34px rgba(84,54,196,.18);
  --sh-fab:0 8px 24px rgba(108,74,226,.34);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;overscroll-behavior-y:none;}
body{
  font-family:'Nunito',system-ui,sans-serif;color:var(--ink);
  background:var(--bg);
  background-image:
    radial-gradient(820px 360px at 50% -10%,rgba(108,74,226,.14),transparent),
    radial-gradient(600px 300px at 90% 10%,rgba(201,154,60,.06),transparent);
  background-attachment:fixed;
}
#app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;}
h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;letter-spacing:-.5px;margin:0;line-height:1.1;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{
  font-family:inherit;width:100%;border:1.5px solid var(--line);border-radius:14px;
  padding:13px 14px;font-size:15px;background:#fff;outline:none;color:var(--ink);
  transition:border-color .15s,box-shadow .15s;
}
textarea{resize:none;line-height:1.5;}
input::placeholder,textarea::placeholder{color:var(--faint);}
input:focus,textarea:focus,select:focus{border-color:var(--violet);box-shadow:0 0 0 4px rgba(108,74,226,.12);}

/* layout */
.screen{padding:18px 18px 120px;}
.muted{color:var(--sub);} .faint{color:var(--faint);} .center{text-align:center;}
.row{display:flex;align-items:center;gap:13px;}

/* topbar */
.topbar{position:sticky;top:0;z-index:8;padding:18px 18px 14px;
  background:linear-gradient(180deg,var(--bg) 62%,rgba(245,241,251,.0));
  backdrop-filter:blur(2px);}
.back{background:none;border:none;color:var(--sub);font-weight:800;font-size:13.5px;padding:6px 0;display:inline-flex;align-items:center;gap:3px;}
.back:active{color:var(--violet);}
.eyebrow{font-size:12.5px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:1.2px;}

/* cards */
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;margin-bottom:12px;box-shadow:var(--sh-sm);overflow:hidden;}
.tap{transition:transform .12s ease,box-shadow .12s ease;}
.tap:active{transform:scale(.985);box-shadow:var(--sh-sm);}

/* buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;margin:0 0 12px;padding:15px 18px;border-radius:16px;border:none;font-size:16px;font-weight:800;transition:transform .12s,box-shadow .2s,opacity .2s;}
.btn:active{transform:scale(.975);}
.btn-primary{background:linear-gradient(135deg,#7857E8,#5B3CC9);color:#fff;box-shadow:var(--sh-lg);}
.btn-gold{background:linear-gradient(135deg,#D6A746,#BE8A2E);color:#fff;box-shadow:0 8px 22px rgba(201,154,60,.3);}
.btn-ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:var(--sh-sm);}
.btn-green{background:linear-gradient(135deg,#23925C,#147544);color:#fff;box-shadow:0 8px 22px rgba(26,133,81,.28);}
.btn-soft{background:var(--lilac);color:var(--vd);}
.btn-danger{background:none;color:var(--danger);border:1.5px solid rgba(192,69,91,.22);}
.btn[disabled]{opacity:.55;pointer-events:none;}
.btn-sm{padding:10px 16px;font-size:14px;border-radius:13px;width:auto;margin:0;}

/* avatar */
.avatar{width:48px;height:48px;border-radius:15px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:20px;flex-shrink:0;font-family:'Fraunces',serif;box-shadow:inset 0 -3px 8px rgba(0,0,0,.12);}
.avatar.lg{width:60px;height:60px;border-radius:19px;font-size:26px;}

/* chips */
.chip{padding:9px 14px;border-radius:22px;border:1.5px solid var(--line);background:#fff;color:var(--ink2);font-weight:800;font-size:13.5px;transition:transform .1s,background .15s,border-color .15s;display:inline-flex;align-items:center;gap:6px;}
.chip:active{transform:scale(.95);}
.chip.on{border-color:var(--violet);background:var(--lilac);color:var(--vd);}

/* bottom nav */
.bottomnav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;
  background:rgba(255,255,255,.86);backdrop-filter:blur(18px) saturate(1.4);
  border-top:1px solid var(--line);display:flex;
  padding:7px 6px calc(7px + env(safe-area-inset-bottom));z-index:30;box-shadow:0 -4px 20px rgba(36,27,51,.05);}
.navbtn{flex:1;border:none;background:none;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 4px;color:var(--faint);font-size:10.5px;font-weight:800;letter-spacing:.2px;transition:color .15s;position:relative;}
.navbtn .ic{font-size:21px;transition:transform .18s cubic-bezier(.34,1.56,.64,1);line-height:1;}
.navbtn.on{color:var(--violet);}
.navbtn.on .ic{transform:translateY(-2px) scale(1.08);}
.navbtn .nbadge{position:absolute;top:2px;right:50%;margin-right:-22px;}

/* fab */
.fab{position:fixed;bottom:calc(78px + env(safe-area-inset-bottom));right:50%;margin-right:-216px;
  background:linear-gradient(135deg,#7857E8,#5B3CC9);color:#fff;border:none;border-radius:18px;
  width:58px;height:58px;font-size:27px;font-weight:400;box-shadow:var(--sh-fab);z-index:25;
  display:flex;align-items:center;justify-content:center;transition:transform .14s;}
.fab:active{transform:scale(.9);}
@media(max-width:480px){.fab{right:18px;margin-right:0;}}

/* sheet */
.backdrop{position:fixed;inset:0;background:rgba(36,27,51,.5);backdrop-filter:blur(2px);display:flex;align-items:flex-end;justify-content:center;z-index:40;animation:fadein .2s ease;}
@keyframes fadein{from{opacity:0;}to{opacity:1;}}
.sheet{width:100%;max-width:480px;background:var(--bg2);border-radius:26px 26px 0 0;padding:14px 20px calc(30px + env(safe-area-inset-bottom));max-height:92vh;overflow-y:auto;animation:slideup .32s cubic-bezier(.22,1,.36,1);box-shadow:0 -10px 40px rgba(36,27,51,.2);}
@keyframes slideup{from{transform:translateY(100%);}to{transform:none;}}
.grab{width:42px;height:5px;background:var(--line);border-radius:5px;margin:0 auto 14px;}

/* misc components */
.iconbox{width:42px;height:42px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;}
.areatag{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:9px;font-size:11.5px;font-weight:800;color:#3a3346;}
.dot{width:7px;height:7px;border-radius:4px;display:inline-block;}
.badge{background:var(--danger);color:#fff;border-radius:20px;min-width:20px;height:20px;font-size:11px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;padding:0 6px;box-shadow:0 2px 6px rgba(192,69,91,.4);}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 11px;border-radius:20px;font-size:12px;font-weight:800;}
.pill-in{background:var(--greenbg);color:var(--green);}
.pill-out{background:#F0ECF6;color:var(--sub);}
.pill-gold{background:var(--goldbg);color:var(--gold);}

/* chat */
.bubble{max-width:80%;padding:10px 14px;border-radius:18px;font-size:14.5px;line-height:1.42;box-shadow:var(--sh-sm);}
.bubble .t{font-size:10.5px;opacity:.7;margin-top:3px;}
.chatbar{position:fixed;bottom:calc(56px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:100%;max-width:480px;padding:12px 14px;background:rgba(255,255,255,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);display:flex;gap:8px;z-index:29;}

/* forms */
.field-row{margin-bottom:15px;}
.field-label{font-size:12px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:1px;margin-bottom:7px;}

/* info cards */
.info-card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px 16px;margin-bottom:11px;box-shadow:var(--sh-sm);}
.info-card .title{font-weight:900;font-size:14px;margin-bottom:10px;display:flex;align-items:center;gap:7px;}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid var(--line2);gap:12px;}
.info-row:last-child{border-bottom:none;}
.info-row .label{font-size:13px;color:var(--sub);flex-shrink:0;}
.info-row .value{font-size:13.5px;font-weight:800;text-align:right;}

/* stat tiles */
.stats{display:flex;gap:10px;margin-bottom:18px;}
.stat{flex:1;background:#fff;border:1px solid var(--line);border-radius:17px;padding:13px 12px;box-shadow:var(--sh-sm);}
.stat .n{font-family:'Fraunces',serif;font-size:27px;font-weight:600;line-height:1;}
.stat .l{font-size:11px;font-weight:800;color:var(--sub);margin-top:5px;text-transform:uppercase;letter-spacing:.5px;}

/* date strip */
.datestrip{display:flex;gap:7px;overflow-x:auto;padding:2px 0 14px;margin:0 -2px;scrollbar-width:none;}
.datestrip::-webkit-scrollbar{display:none;}
.daypill{flex-shrink:0;min-width:50px;padding:9px 6px;border-radius:14px;background:#fff;border:1.5px solid var(--line);text-align:center;transition:all .15s;}
.daypill.on{background:var(--ink);border-color:var(--ink);}
.daypill .dow{font-size:10.5px;font-weight:800;color:var(--sub);text-transform:uppercase;}
.daypill .dnum{font-size:17px;font-weight:900;margin-top:2px;}
.daypill.on .dow,.daypill.on .dnum{color:#fff;}

/* timeline */
.tl-item{display:flex;gap:13px;}
.tl-rail{display:flex;flex-direction:column;align-items:center;flex-shrink:0;}
.tl-line{width:2px;flex:1;background:var(--line);margin:2px 0;}

/* skeleton */
.skel{background:linear-gradient(90deg,#ECE6F4 25%,#F5F1FB 50%,#ECE6F4 75%);background-size:200% 100%;animation:shimmer 1.4s infinite;border-radius:14px;}
@keyframes shimmer{to{background-position:-200% 0;}}

/* empty states */
.empty{text-align:center;padding:50px 24px;}
.empty .em{font-size:46px;margin-bottom:12px;filter:saturate(.85);}
.empty .et{font-family:'Fraunces',serif;font-size:20px;font-weight:600;margin-bottom:6px;}
.empty .es{font-size:14px;color:var(--sub);line-height:1.5;}

/* next steps */
.next{margin-top:12px;padding:12px 14px;border-radius:13px;background:var(--goldbg);border-left:3px solid var(--gold);}
.next .lbl{font-size:11px;font-weight:900;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px;}

/* splash */
.splash{padding:64px 26px 40px;text-align:center;}
.mark{width:78px;height:78px;border-radius:24px;background:linear-gradient(145deg,#8466EC,#5436C4);margin:0 auto 18px;display:flex;align-items:center;justify-content:center;font-size:38px;box-shadow:0 16px 40px rgba(84,54,196,.42),inset 0 -4px 12px rgba(0,0,0,.18);}
.err{color:var(--danger);font-size:13.5px;font-weight:800;margin:4px 0 12px;background:#FCF1F3;padding:11px 14px;border-radius:12px;}
.green-box{background:var(--greenbg);border-radius:13px;padding:13px 14px;display:flex;align-items:center;gap:11px;margin:6px 0 14px;border:1px solid rgba(26,133,81,.14);}

/* notif toast */
.toast-banner{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-220px);width:calc(100% - 28px);max-width:452px;background:var(--ink);color:#fff;padding:14px 16px;border-radius:18px;box-shadow:0 14px 38px rgba(36,27,51,.32);z-index:999;display:flex;align-items:center;gap:12px;transition:transform .45s cubic-bezier(.17,.89,.32,1.28);cursor:pointer;}
.toast-banner.show{transform:translateX(-50%) translateY(0);}

/* animations */
.fade{animation:rise .4s cubic-bezier(.22,1,.36,1) both;}
@keyframes rise{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--violet);border-radius:50%;animation:sp .8s linear infinite;margin:60px auto;}
@keyframes sp{to{transform:rotate(360deg);}}
.seg{display:flex;background:var(--lilac2);border-radius:14px;padding:4px;gap:4px;margin-bottom:16px;}
.seg button{flex:1;border:none;background:none;padding:9px;border-radius:11px;font-weight:800;font-size:13.5px;color:var(--sub);transition:all .18s;}
.seg button.on{background:#fff;color:var(--vd);box-shadow:var(--sh-sm);}
</style>
</head>
<body>
<div id="app"><div class="spin"></div></div>
<div id="toast" class="toast-banner">
  <div style="font-size:22px" id="toast-icon">💬</div>
  <div style="flex:1;min-width:0">
    <div style="font-weight:900;font-size:11.5px;text-transform:uppercase;letter-spacing:.5px;opacity:.7" id="toast-title"></div>
    <div style="font-size:14.5px;font-weight:700;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="toast-body"></div>
  </div>
</div>

<script>
window.onerror=function(msg,src,line){
  document.getElementById("app").innerHTML='<div style="padding:24px 20px;font-family:monospace;font-size:12px;color:#C0455B;background:#fff8f8;margin:20px;border-radius:12px"><b>Error (line '+line+'):</b><br>'+msg+'</div>';
};
window.onunhandledrejection=function(e){
  document.getElementById("app").innerHTML='<div style="padding:24px 20px;font-family:monospace;font-size:12px;color:#C0455B;background:#fff8f8;margin:20px;border-radius:12px"><b>Promise error:</b><br>'+(e.reason?.message||String(e.reason))+'</div>';
};
</script>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,updateProfile}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,getDocs,setDoc,addDoc,updateDoc,deleteDoc,collection,query,orderBy,onSnapshot,serverTimestamp,arrayUnion}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyCPl0p0di8yTNhZVPEP5SMYeR528kiYFrw",authDomain:"littlenest94.firebaseapp.com",projectId:"littlenest94",messagingSenderId:"8804693290",appId:"1:8804693290:web:cbd50128a876a043c79a53"};
const fb=initializeApp(firebaseConfig);
const auth=getAuth(fb);
const db=getFirestore(fb);

if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ── constants ── */
const AREAS={cl:{short:"C&L",label:"Communication & Language",prime:true,colour:"#7FA8C9"},pd:{short:"PD",label:"Physical Development",prime:true,colour:"#C26B4E"},psed:{short:"PSED",label:"Personal, Social & Emotional",prime:true,colour:"#D9A441"},lit:{short:"Lit",label:"Literacy",prime:false,colour:"#8E6BA8"},ma:{short:"Maths",label:"Mathematics",prime:false,colour:"#5B9A8B"},utw:{short:"UtW",label:"Understanding the World",prime:false,colour:"#A8924E"},ead:{short:"EAD",label:"Expressive Arts & Design",prime:false,colour:"#C76B8A"}};
const TYPES={
  meal:{label:"Meal",icon:"🍽️",tint:"#EEE8FB",ph:"What did they eat?",portion:true},
  nap:{label:"Nap",icon:"😴",tint:"#E4ECF4",ph:"How did they sleep?",times:true},
  nappy:{label:"Nappy",icon:"🧷",tint:"#EDE6F4",ph:"Wet / dirty / dry",opts:["Wet","Dirty","Dry"]},
  bottle:{label:"Bottle",icon:"🍼",tint:"#E9F0F6",ph:"How many oz / ml?"},
  activity:{label:"Activity",icon:"🧩",tint:"#E5F1E6",ph:"What did they get up to?"},
  mood:{label:"Mood",icon:"😊",tint:"#FBF1DC",ph:"How were they feeling?",opts:["Happy","Settled","Tired","Upset","Poorly"]},
  note:{label:"Note",icon:"📝",tint:"#F2ECE6",ph:"Anything to share…"}
};
const PORTIONS=["All","Most","Some","None"];
const COLOURS=["#6C4AE2","#5B7B6F","#C26B4E","#9A7BB0","#D9A441","#5B9A8B","#8E6BA8","#C76B8A"];
const ICON="https://img.icons8.com/fluency/512/nest.png";

/* ── helpers ── */
const $=(s,r=document)=>r.querySelector(s);
const app=$("#app");
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtTime=ts=>{const d=ts?.toDate?ts.toDate():(ts instanceof Date?ts:new Date());return d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});};
const fmtDate=ts=>{const d=ts?.toDate?ts.toDate():new Date();const t=new Date();return d.toDateString()===t.toDateString()?"Today":d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});};
const phoneForWA=p=>{if(!p)return null;const c=p.replace(/\D/g,"");if(c.startsWith("07"))return"44"+c.slice(1);if(c.startsWith("44"))return c;return c;};
const greeting=()=>{const h=new Date().getHours();return h<12?"Good morning":h<17?"Good afternoon":"Good evening";};
const todayKey=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");};
const keyOf=d=>d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
const dateOfEntry=ts=>{const d=ts?.toDate?ts.toDate():new Date();return keyOf(d);};
function ageFromDob(dob){
  const m=(dob||"").match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
  if(!m)return dob||"";
  const bd=new Date(+m[3],+m[2]-1,+m[1]),now=new Date();
  let mo=(now.getFullYear()-bd.getFullYear())*12+(now.getMonth()-bd.getMonth());
  if(now.getDate()<bd.getDate())mo--;
  if(mo<0)return dob;
  const y=Math.floor(mo/12),r=mo%12;
  return y>0?`${y}y ${r}m`:`${r}m`;
}

/* ── state ── */
let state={profile:null,settingId:null,activeChildId:null,currentTab:null};
let subs=[],alertSubs=[];
let unread={};
const clearSubs=()=>{subs.forEach(u=>u&&u());subs=[];};
const clearAlerts=()=>{alertSubs.forEach(u=>u&&u());alertSubs=[];};

/* ── notifications ── */
async function requestNotifPermission(){
  if(!('Notification' in window))return;
  if(Notification.permission==='default') await Notification.requestPermission();
}
function pushNotif(title,body,childId,onClick){
  toast(title,body,onClick);
  if(window.Notification&&Notification.permission==='granted'){
    try{const n=new Notification("LittleNest 🪺",{body:`${title}: ${body}`,icon:ICON,badge:ICON,tag:childId||"ln",renotify:true});
      n.onclick=()=>{window.focus();n.close();if(onClick)onClick();};}catch(e){}
  }
}
function toast(title,body,onClick){
  const t=$("#toast");
  $("#toast-title").textContent=title;
  $("#toast-body").textContent=body||"";
  t.classList.add("show");
  t.onclick=()=>{t.classList.remove("show");if(onClick)onClick();};
  clearTimeout(t._timer);t._timer=setTimeout(()=>t.classList.remove("show"),5200);
}

/* ── cross-feed alerts ── */
function initAlerts(role,settingId,childIds=[]){
  clearAlerts();
  childIds.forEach(cid=>{
    const base=["settings",settingId,"children",cid];
    const qm=query(collection(db,...base,"messages"),orderBy("createdAt","desc"));
    let im=true;
    alertSubs.push(onSnapshot(qm,s=>{
      if(im){im=false;return;}
      if(!s.empty){
        const m=s.docs[0].data();
        const fromOther=role==="minder"?m.from==="parent":m.from==="fran";
        if(fromOther&&!(state.activeChildId===cid&&state.currentTab==="chat")){
          if(role==="minder"){unread[cid]=(unread[cid]||0)+1;refreshBadges();}
          pushNotif("💬 New message",m.text,cid,()=>navToChild(cid,settingId,role==="minder","chat"));
        }
      }
    }));
    if(role==="parent"){
      const qd=query(collection(db,...base,"entries"),orderBy("createdAt","desc"));
      let id=true;
      alertSubs.push(onSnapshot(qd,s=>{
        if(id){id=false;return;}
        if(!s.empty&&!(state.activeChildId===cid&&state.currentTab==="diary")){
          const e=s.docs[0].data();

        }
      }));
    }
  });
}

  app.innerHTML='<div class="spin"></div><p class="center" style="margin-top:0;padding:0 20px"><button id="bail" style="background:none;border:none;color:var(--sub);font-size:13px;font-family:inherit;cursor:pointer;text-decoration:underline">Having trouble? Tap to sign out</button></p>';

  const timeout=setTimeout(()=>signOut(auth),9000);
  try{

    clearTimeout(timeout);
    if(snap.exists()){
      state.profile=snap.data();state.settingId=state.profile.settingId;
      await requestNotifPermission();
      if(state.profile.role==="minder"){
        const kids=await getDocs(collection(db,"settings",state.settingId,"children"));

  let attHtml;

  else if(att&&att.signOutAt) attHtml=`<span class="pill pill-out">Out ${fmtTime(att.signOutAt)}</span>`;
  else attHtml=`<span class="pill pill-out">Not in yet</span>`;
  return `<div class="card fade" style="animation-delay:${i*.04}s;padding:14px">
    <div class="row" data-open="${c.id}">

        <span data-badge="${c.id}">${uc>0?`<span class="badge">${uc}</span>`:""}</span>
        <span class="muted" style="font-size:22px;line-height:1">›</span>
      </div>
    </div>
    ${linked?`<div style="display:flex;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line2)">
      ${att&&att.signInAt&&!att.signOutAt
        ? `<button class="btn btn-ghost btn-sm" style="flex:1" data-out="${c.id}">Sign out</button>`
        : att&&att.signOutAt
          ? `<button class="btn btn-ghost btn-sm" style="flex:1" data-undo="${c.id}">Undo sign-out</button>`

      </div>`}
  </div>`;
}

  app.querySelectorAll("[data-out]").forEach(b=>b.onclick=async e=>{e.stopPropagation();b.disabled=true;await setDoc(doc(db,"settings",state.settingId,"children",b.dataset.out,"attendance",todayKey()),{signOutAt:serverTimestamp()},{merge:true});toast("✓ Signed out",map[b.dataset.out].name+" marked as out");renderMinderHome();});
  app.querySelectorAll("[data-undo]").forEach(b=>b.onclick=async e=>{e.stopPropagation();b.disabled=true;await updateDoc(doc(db,"settings",state.settingId,"children",b.dataset.undo,"attendance",todayKey()),{signOutAt:null});renderMinderHome();});
  app.querySelectorAll("[data-update]").forEach(b=>b.onclick=e=>{e.stopPropagation();const c=map[b.dataset.update];openDiaryComposer(["settings",state.settingId,"children",c.id],c.name,c.id);});

/* ── day summary (image export, native share sheet) ── */
async function shareDaySummary(base,child,entries,key){
  const dayLabel=key===todayKey()?"Today":new Date(key).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"});
  const btn=$("#summary");
  if(btn){btn.disabled=true;btn.textContent="Preparing…";}
  try{
    let observations=[];
    try{
      const os=await getDocs(query(collection(db,...base,"observations"),orderBy("createdAt","desc")));
      observations=os.docs.map(d=>d.data()).filter(o=>dateOfEntry(o.createdAt)===key);
    }catch(e){}
    const blob=await renderDaySummaryImage(child,entries.slice().reverse(),observations,dayLabel);
    const fname=`${(child.name||"child").replace(/\s+/g,"-")}-${key}.png`;
    const file=new File([blob],fname,{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:`${child.name}'s day`,text:`${child.name}'s day — ${dayLabel} 🪺`});
    }else{
      const url=URL.createObjectURL(blob);
      const a=document.createElement("a");a.href=url;a.download=fname;document.body.appendChild(a);a.click();a.remove();
      setTimeout(()=>URL.revokeObjectURL(url),4000);
      toast("✓ Saved",'Day summary image saved to your device');
    }
  }catch(e){
    if(e.name!=="AbortError")toast("Couldn't create summary",e.message||"");
  }finally{
    if(btn){btn.disabled=false;btn.textContent=`📋 Share ${esc((child.name||"").split(" ")[0])}'s day summary`;}
  }
}

/* renders a shareable PNG (works offline, no libraries, previews well in WhatsApp) */
async function renderDaySummaryImage(child,entries,observations,dayLabel){
  try{if(document.fonts&&document.fonts.ready)await document.fonts.ready;}catch(e){}
  const W=640,SCALE=2,PAD=28,MAXH=3000;
  const work=document.createElement("canvas");
  work.width=W*SCALE;work.height=MAXH*SCALE;
  const ctx=work.getContext("2d");
  ctx.scale(SCALE,SCALE);
  ctx.fillStyle="#F5F1FB";ctx.fillRect(0,0,W,MAXH);
  ctx.textBaseline="alphabetic";
  const wrap=(text,font,maxWidth)=>{
    ctx.font=font;const words=(text||"").split(/\s+/).filter(Boolean);const lines=[];let cur="";
    for(const w of words){const t=cur?cur+" "+w:w;if(ctx.measureText(t).width>maxWidth&&cur){lines.push(cur);cur=w;}else cur=t;}
    if(cur)lines.push(cur);return lines;
  };

  const grad=ctx.createLinearGradient(0,0,W,132);
  grad.addColorStop(0,"#7857E8");grad.addColorStop(1,"#5436C4");
  ctx.fillStyle=grad;ctx.fillRect(0,0,W,132);
  ctx.fillStyle="rgba(255,255,255,.85)";ctx.font="800 12px Nunito, sans-serif";
  ctx.fillText("🪺  LITTLENEST DAILY SUMMARY",PAD,32);
  ctx.fillStyle="#fff";ctx.font="600 34px Fraunces, serif";
  ctx.fillText(child.name||"",PAD,78);
  ctx.font="700 15px Nunito, sans-serif";ctx.fillStyle="rgba(255,255,255,.92)";
  ctx.fillText(dayLabel,PAD,104);

  let y=132+30;
  const lineWidth=W-PAD*2;

  if(!entries.length&&!observations.length){
    ctx.fillStyle="#7E7591";ctx.font="600 15px Nunito, sans-serif";
    ctx.fillText("Nothing logged for this day.",PAD,y+18);y+=50;
  }

  if(entries.length){
    ctx.fillStyle="#241B33";ctx.font="800 12px Nunito, sans-serif";
    ctx.fillText("TODAY'S CARE LOG",PAD,y);y+=22;
    for(const e of entries){
      const t=TYPES[e.type]||TYPES.note;
      ctx.font="24px sans-serif";ctx.fillText(t.icon,PAD,y+20);
      let meta=t.label;
      if(e.startTime&&e.endTime)meta+=`  ${e.startTime}–${e.endTime}`;
      else if(e.portion)meta+=`  ·  ate ${e.portion.toLowerCase()}`;
      ctx.font="800 15px Nunito, sans-serif";ctx.fillStyle="#241B33";
      ctx.fillText(meta,PAD+34,y+16);
      ctx.font="700 12px Nunito, sans-serif";ctx.fillStyle="#7E7591";
      ctx.textAlign="right";ctx.fillText(fmtTime(e.createdAt),W-PAD,y+16);ctx.textAlign="left";
      y+=24;
      if(e.detail){
        const lines=wrap(e.detail,"600 14px Nunito, sans-serif",W-PAD-34);
        ctx.fillStyle="#3A3147";
        for(const ln of lines){ctx.fillText(ln,PAD+34,y+12);y+=19;}
      }
      y+=14;
    }
  }

  if(observations.length){
    y+=8;
    ctx.fillStyle="#241B33";ctx.font="800 12px Nunito, sans-serif";
    ctx.fillText("LEARNING JOURNEY",PAD,y);y+=24;
    for(const o of observations){
      ctx.font="600 18px Fraunces, serif";ctx.fillStyle="#241B33";
      ctx.fillText(o.title||"",PAD,y+16);y+=26;
      if((o.areas||[]).length){
        ctx.font="800 11px Nunito, sans-serif";let x=PAD;
        for(const a of o.areas){
          const ar=AREAS[a];if(!ar)continue;
          const label=ar.short,tw=ctx.measureText(label).width+16;
          ctx.fillStyle=ar.colour+"33";ctx.fillRect(x,y,tw,20);
          ctx.fillStyle="#3a3346";ctx.fillText(label,x+8,y+14);
          x+=tw+6;
        }
        y+=30;
      }
      if(o.note){
        const lines=wrap(o.note,"600 14px Nunito, sans-serif",lineWidth);
        ctx.fillStyle="#3A3147";
        for(const ln of lines){ctx.fillText(ln,PAD,y+12);y+=19;}
      }
      if(o.nextSteps){
        y+=4;
        const lines=wrap("Next steps: "+o.nextSteps,"700 13px Nunito, sans-serif",lineWidth);
        ctx.fillStyle="#C99A3C";
        for(const ln of lines){ctx.fillText(ln,PAD,y+12);y+=18;}
      }
      y+=16;
    }
  }

  y+=8;
  ctx.strokeStyle="#EBE4F4";ctx.beginPath();ctx.moveTo(PAD,y);ctx.lineTo(W-PAD,y);ctx.stroke();
  y+=22;
  ctx.fillStyle="#A79FB8";ctx.font="700 11px Nunito, sans-serif";
  ctx.fillText(`Shared via LittleNest 🪺  ·  ${new Date().toLocaleString("en-GB",{day:"numeric",month:"short",hour:"2-digit",minute:"2-digit"})}`,PAD,y);
  y+=20;

  const finalH=Math.min(Math.ceil(y+PAD),MAXH);
  const out=document.createElement("canvas");
  out.width=W*SCALE;out.height=finalH*SCALE;
  out.getContext("2d").drawImage(work,0,0,W*SCALE,finalH*SCALE,0,0,W*SCALE,finalH*SCALE);
  return new Promise(res=>out.toBlob(res,"image/png",0.95));
}

/* ── cards ── */
function timelineRow(e,i,last){
  const t=TYPES[e.type]||TYPES.note;
  let meta="";
  if(e.startTime&&e.endTime)meta=`<span class="pill pill-gold" style="margin-left:6px">${esc(e.startTime)}–${esc(e.endTime)}</span>`;
  else if(e.portion)meta=`<span class="pill pill-gold" style="margin-left:6px">Ate ${esc(e.portion.toLowerCase())}</span>`;
  return `<div class="tl-item">
    <div class="tl-rail"><div class="iconbox" style="background:${t.tint};width:38px;height:38px;font-size:18px">${t.icon}</div>${last?"":'<div class="tl-line"></div>'}</div>
    <div style="flex:1;padding-bottom:${last?"4":"16"}px;min-width:0">
      <div style="display:flex;justify-content:space-between;align-items:baseline;gap:8px">
        <span style="font-weight:900;font-size:14.5px">${t.label}${meta}</span>
        <span class="muted" style="font-size:12px;font-weight:800;flex-shrink:0">${fmtTime(e.createdAt)}</span>
      </div>
      ${e.detail?`<div style="font-size:14px;line-height:1.45;margin-top:3px;color:var(--ink2)">${esc(e.detail)}</div>`:""}
    </div></div>`;
}
function obsCard(o,i){
  return `<div class="card fade" style="animation-delay:${(i||0)*.04}s"><div style="padding:16px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:8px">
      <span style="font-family:'Fraunces',serif;font-weight:600;font-size:19px;line-height:1.2">${esc(o.title)}</span>
      <span class="muted" style="font-size:12px;font-weight:800;flex-shrink:0">${fmtDate(o.createdAt)}</span>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:11px">${(o.areas||[]).map(areaTag).join("")}</div>
    <div style="font-size:14.5px;line-height:1.55">${esc(o.note)}</div>
    ${o.nextSteps?`<div class="next"><div class="lbl">Next steps</div><div style="font-size:13.5px;line-height:1.45">${esc(o.nextSteps)}</div></div>`:""}
  </div></div>`;
}
function areaTag(a){const x=AREAS[a];if(!x)return"";return `<span class="areatag" style="background:${x.colour}22"><span class="dot" style="background:${x.colour}"></span>${x.short}</span>`;}

  getDoc(doc(db,"settings",state.settingId,"children",childId)).then(s=>{if(s.exists())parentPhone=s.data().parentPhone;}).catch(()=>{});
  const sheet=mountSheet("New update",`
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px" id="types">
      ${Object.entries(TYPES).map(([k,v])=>`<button class="chip${k==="meal"?" on":""}" data-k="${k}">${v.icon} ${v.label}</button>`).join("")}
    </div>

    <textarea id="detail" rows="3" placeholder="${TYPES.meal.ph}"></textarea>

    </div>
    <button class="btn btn-primary" id="save">Post to parent</button>`);
  const renderExtra=()=>{

        <div style="flex:1"><div class="field-label">Awake</div><input type="time" id="et"></div></div>`;
    }else if(t.portion){
      ex.innerHTML=`<div class="field-label">How much did they eat?</div><div style="display:flex;gap:8px;margin-bottom:14px" id="ports">${PORTIONS.map((p,i)=>`<button class="chip${i===0?" on":""}" data-p="${p}" style="flex:1;justify-content:center">${p}</button>`).join("")}</div>`;
      extra.portion="All";
      ex.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{extra.portion=b.dataset.p;ex.querySelectorAll("[data-p]").forEach(x=>x.classList.toggle("on",x===b));});
    }else if(t.opts){
      ex.innerHTML=`<div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px" id="opts">${t.opts.map(o=>`<button class="chip" data-o="${o}" style="flex:1;justify-content:center;min-width:70px">${o}</button>`).join("")}</div>`;
      ex.querySelectorAll("[data-o]").forEach(b=>b.onclick=()=>{const cur=$("#detail").value.trim();$("#detail").value=b.dataset.o;ex.querySelectorAll("[data-o]").forEach(x=>x.classList.toggle("on",x===b));});
    }else ex.innerHTML="";
  };
  renderExtra();
  sheet.querySelectorAll("#types .chip").forEach(c=>c.onclick=()=>{type=c.dataset.k;sheet.querySelectorAll("#types .chip").forEach(x=>x.classList.toggle("on",x===c));renderExtra();});
  $("#save").onclick=async()=>{
    const detail=$("#detail").value.trim();
    const t=TYPES[type];
    const rec={type,detail,createdAt:serverTimestamp()};
    if(t.times){const st=$("#st")?.value,et=$("#et")?.value;if(st)rec.startTime=st;if(et)rec.endTime=et;}
    if(t.portion&&extra.portion)rec.portion=extra.portion;
    if(!detail&&!rec.startTime&&!rec.portion){$("#detail").focus();return;}
    $("#save").disabled=true;$("#save").textContent="Posting…";
    await addDoc(collection(db,...base,"entries"),rec);
    if($("#wa").checked){
      let summary=t.label;if(rec.startTime&&rec.endTime)summary+=` ${rec.startTime}–${rec.endTime}`;if(rec.portion)summary+=` (ate ${rec.portion.toLowerCase()})`;
      const msg=`Hi! New update for ${childName} on LittleNest ${t.icon}\n\n${summary}${detail?`\n"${detail}"`:""}`;
      const waNum=phoneForWA(parentPhone);
      window.open(waNum?`https://wa.me/${waNum}?text=${encodeURIComponent(msg)}`:`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`,"_blank");
    }
    sheet.remove();
  };
}

function openObsComposer(base){
  let areas=[];
  const sheet=mountSheet("New observation",`
    <div class="field-row"><input id="title" placeholder="Title — e.g. Building a tall tower"></div>
    <div class="field-row"><textarea id="note" rows="4" placeholder="What did you see? Describe the moment…"></textarea></div>
    <div class="field-label" style="margin-bottom:8px">EYFS areas of learning</div>
    <div id="areas" style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px">
      ${Object.entries(AREAS).map(([k,v])=>`<button class="chip" data-k="${k}"><span class="dot" style="background:${v.colour}"></span>${v.short}${v.prime?'<span class="muted" style="font-weight:700"> ·prime</span>':""}</button>`).join("")}
    </div>
    <div class="field-row"><textarea id="next" rows="2" placeholder="Next steps (optional) — how will you extend this?"></textarea></div>
    <button class="btn btn-gold" id="save">Save to journey</button>`);
  sheet.querySelectorAll("#areas .chip").forEach(c=>c.onclick=()=>{const k=c.dataset.k;if(areas.includes(k)){areas=areas.filter(x=>x!==k);c.classList.remove("on");}else{areas.push(k);c.classList.add("on");}});
  $("#save").onclick=async()=>{
    const title=$("#title").value.trim(),note=$("#note").value.trim();
    if(!title||!note||!areas.length){alert("Add a title, a note and at least one EYFS area.");return;}
    $("#save").disabled=true;$("#save").textContent="Saving…";
    await addDoc(collection(db,...base,"observations"),{title,note,areas,nextSteps:$("#next").value.trim(),createdAt:serverTimestamp()});
    sheet.remove();
  };
}

function mountSheet(title,inner){
  const bd=document.createElement("div");bd.className="backdrop";
  bd.innerHTML=`<div class="sheet"><div class="grab"></div><h3 style="font-size:24px;margin-bottom:16px">${title}</h3>${inner}</div>`;
  bd.onclick=e=>{if(e.target===bd)bd.remove();};
  document.body.appendChild(bd);
  return bd;
}
</script>
