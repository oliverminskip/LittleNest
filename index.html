<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#6C4AE2"/>
<title>LittleNest</title>
<link rel="manifest" href="manifest.json"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<link rel="apple-touch-icon" href="https://img.icons8.com/fluency/512/nest.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F3FC;--card:#fff;--ink:#241B33;--sub:#7E7591;--violet:#6C4AE2;--vd:#5436C4;--lilac:#EEE8FB;--line:#ECE6F5;--gold:#C99A3C;--danger:#C0455B;--green:#1A7F4B;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:var(--bg);background-image:radial-gradient(900px 380px at 50% -8%,rgba(108,74,226,.15),transparent);}
#app{max-width:480px;margin:0 auto;min-height:100vh;}
h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;letter-spacing:-.4px;margin:0;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;width:100%;border:1px solid var(--line);border-radius:14px;padding:13px;font-size:15px;background:#fff;outline:none;color:var(--ink);}
textarea{resize:none;line-height:1.45;}
input:focus,textarea:focus,select:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(108,74,226,.12);}
.screen{padding:22px 20px 130px;}
.muted{color:var(--sub);}
.center{text-align:center;}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:12px;box-shadow:0 1px 2px rgba(36,27,51,.04);overflow:hidden;}
.btn{display:block;width:100%;margin:0 0 12px;padding:15px 18px;border-radius:16px;border:none;font-size:16px;font-weight:800;}
.btn-primary{background:var(--violet);color:#fff;box-shadow:0 8px 22px rgba(108,74,226,.28);}
.btn-gold{background:var(--gold);color:#fff;}
.btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line);}
.btn-green{background:var(--green);color:#fff;}
.btn-danger{background:none;color:var(--danger);border:1px solid rgba(192,69,91,0.2);margin-top:24px;}
.btn[disabled]{opacity:.5;pointer-events:none;}
.row{display:flex;align-items:center;gap:13px;}
.avatar{width:46px;height:46px;border-radius:14px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex-shrink:0;}
.topbar{position:sticky;top:0;background:var(--bg);z-index:5;padding:20px 20px 12px;}
.back{background:none;border:none;color:var(--sub);font-weight:700;font-size:13px;padding:0;}
.tabs{display:flex;gap:6px;padding:0 20px 12px;overflow-x:auto;}
.tab{flex:1;min-width:0;padding:9px 4px;border-radius:12px;border:none;font-weight:800;font-size:13px;white-space:nowrap;background:#fff;color:var(--sub);box-shadow:inset 0 0 0 1px var(--line);}
.tab.on{background:var(--ink);color:#fff;box-shadow:none;}
.chip{padding:8px 13px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:13px;}
.chip.on{border:1.5px solid var(--violet);background:var(--lilac);color:var(--vd);}
.fab{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border:none;border-radius:30px;padding:14px 26px;font-size:15px;font-weight:800;box-shadow:0 8px 24px rgba(36,27,51,.3);z-index:20;white-space:nowrap;}
.backdrop{position:fixed;inset:0;background:rgba(36,27,51,.45);display:flex;align-items:flex-end;justify-content:center;z-index:40;}
.sheet{width:100%;max-width:480px;background:var(--bg);border-radius:24px 24px 0 0;padding:16px 20px 32px;max-height:92vh;overflow-y:auto;}
.grab{width:40px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 16px;}
.iconbox{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
.areatag{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:8px;font-size:11.5px;font-weight:800;color:#3a3346;}
.dot{width:7px;height:7px;border-radius:4px;display:inline-block;}
.badge{background:var(--danger);color:#fff;border-radius:20px;min-width:20px;height:20px;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;}
.bubble{max-width:78%;padding:9px 13px;border-radius:16px;font-size:14.5px;line-height:1.4;}
.bubble .t{font-size:10.5px;opacity:.7;margin-top:3px;text-align:right;}
.chatbar{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;padding:12px 14px;background:var(--bg);border-top:1px solid var(--line);display:flex;gap:8px;z-index:10;}
.err{color:var(--danger);font-size:13.5px;font-weight:700;margin:4px 0 12px;}
.next{margin-top:12px;padding:12px;border-radius:12px;background:#FBF4E3;border-left:3px solid var(--gold);}
.next .lbl{font-size:11px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px;}
.splash{padding:74px 28px;text-align:center;}
.mark{width:66px;height:66px;border-radius:21px;background:linear-gradient(145deg,#7C5CE6,#5436C4);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 12px 34px rgba(84,54,196,.4);}
.fade{animation:rise .35s ease both;}
@keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--violet);border-radius:50%;animation:sp .8s linear infinite;margin:80px auto;}
@keyframes sp{to{transform:rotate(360deg);}}
.field-row{margin-bottom:14px;}
.field-label{font-size:12px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.info-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;}
.info-card .title{font-weight:800;font-size:14px;margin-bottom:8px;}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);}
.info-row:last-child{border-bottom:none;}
.info-row .label{font-size:13px;color:var(--sub);}
.info-row .value{font-size:13.5px;font-weight:700;text-align:right;}
.notif-bar{background:linear-gradient(135deg,var(--violet),var(--vd));color:#fff;border-radius:14px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px;}
.toast-banner{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-200px);width:calc(100% - 32px);max-width:440px;background:var(--ink);color:#fff;padding:14px 16px;border-radius:16px;box-shadow:0 12px 32px rgba(36,27,51,.24);z-index:999;display:flex;align-items:center;gap:12px;transition:transform 0.4s cubic-bezier(0.175,0.885,0.32,1.275);cursor:pointer;}
.toast-banner.show{transform:translateX(-50%) translateY(0);}
.green-box{background:#E8F7EE;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;margin:14px 0;}
</style>
</head>
<body>
<div id="app"><div class="spin"></div></div>
<div id="toast" class="toast-banner">
  <div style="font-size:22px" id="toast-icon">💬</div>
  <div style="flex:1">
    <div style="font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.5px;opacity:.7" id="toast-title"></div>
    <div style="font-size:14.5px;font-weight:600;margin-top:1px" id="toast-body"></div>
  </div>
</div>

<script>
window.onerror=function(msg,src,line){
  document.getElementById("app").innerHTML='<div style="padding:24px 20px;font-family:monospace;font-size:12px;color:#C0455B;background:#fff8f8;margin:20px;border-radius:12px"><b>Error (line '+line+'):</b><br>'+msg+'</div>';
};
window.onunhandledrejection=function(e){
  document.getElementById("app").innerHTML='<div style="padding:24px 20px;font-family:monospace;font-size:12px;color:#C0455B;background:#fff8f8;margin:20px;border-radius:12px"><b>Promise error:</b><br>'+(e.reason?.message||String(e.reason))+'</div>';
};
</script>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,updateProfile}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,getDocs,setDoc,addDoc,updateDoc,deleteDoc,collection,query,orderBy,onSnapshot,serverTimestamp,arrayUnion}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyCPl0p0di8yTNhZVPEP5SMYeR528kiYFrw",authDomain:"littlenest94.firebaseapp.com",projectId:"littlenest94",messagingSenderId:"8804693290",appId:"1:8804693290:web:cbd50128a876a043c79a53"};
const fb=initializeApp(firebaseConfig);
const auth=getAuth(fb);
const db=getFirestore(fb);

/* ── service worker ── */
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ── constants ── */
const AREAS={cl:{short:"C&L",label:"Communication & Language",prime:true,colour:"#7FA8C9"},pd:{short:"PD",label:"Physical Development",prime:true,colour:"#C26B4E"},psed:{short:"PSED",label:"Personal, Social & Emotional",prime:true,colour:"#D9A441"},lit:{short:"Lit",label:"Literacy",prime:false,colour:"#8E6BA8"},ma:{short:"Maths",label:"Mathematics",prime:false,colour:"#5B9A8B"},utw:{short:"UtW",label:"Understanding the World",prime:false,colour:"#A8924E"},ead:{short:"EAD",label:"Expressive Arts & Design",prime:false,colour:"#C76B8A"}};
const TYPES={meal:{label:"Meal",icon:"🍽️",tint:"#EEE8FB"},nap:{label:"Nap",icon:"😴",tint:"#E4ECF4"},nappy:{label:"Nappy",icon:"🧷",tint:"#EDE6F4"},activity:{label:"Activity",icon:"🧩",tint:"#E5F1E6"},mood:{label:"Mood",icon:"😊",tint:"#FBF1DC"},note:{label:"Note",icon:"📝",tint:"#F2ECE6"}};
const COLOURS=["#6C4AE2","#5B7B6F","#C26B4E","#9A7BB0","#D9A441","#5B9A8B"];
const ICON="https://img.icons8.com/fluency/512/nest.png";

/* ── helpers ── */
const $=(s,r=document)=>r.querySelector(s);
const app=$("#app");
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtTime=ts=>{const d=ts?.toDate?ts.toDate():new Date();return d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});};
const fmtDate=ts=>{const d=ts?.toDate?ts.toDate():new Date();const t=new Date();return d.toDateString()===t.toDateString()?"Today":d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});};
const phoneForWA=p=>{if(!p)return null;const c=p.replace(/\D/g,"");if(c.startsWith("07"))return"44"+c.slice(1);if(c.startsWith("44"))return c;return c;};

/* ── state ── */
let state={profile:null,settingId:null,activeChildId:null,currentTab:null};
let subs=[],alertSubs=[];
let unread={};  // {childId: count} — in-memory unread badges
const clearSubs=()=>{subs.forEach(u=>u&&u());subs=[];};
const clearAlerts=()=>{alertSubs.forEach(u=>u&&u());alertSubs=[];};

/* ── notifications ── */
async function requestNotifPermission(){
  if(!('Notification' in window))return;
  if(Notification.permission==='default') await Notification.requestPermission();
}
function pushNotif(title,body,childId,onClick){
  // In-app toast always fires
  toast(title,body,onClick);
  // Native notification if permission granted
  if(Notification.permission==='granted'){
    try{
      const n=new Notification("LittleNest 🪺",{body:`${title}: ${body}`,icon:ICON,badge:ICON,tag:childId||"ln",renotify:true});
      n.onclick=()=>{window.focus();n.close();if(onClick)onClick();};
    }catch(e){}
  }
}

/* ── toast ── */
function toast(title,body,onClick){
  const t=$("#toast");
  $("#toast-title").textContent=title;
  $("#toast-body").textContent=(body||"").length>55?(body||"").slice(0,52)+"...":(body||"");
  t.classList.add("show");
  t.onclick=()=>{t.classList.remove("show");if(onClick)onClick();};
  setTimeout(()=>t.classList.remove("show"),5500);
}

/* ── cross-feed alerts ── */
function initAlerts(role,settingId,childIds=[]){
  clearAlerts();
  childIds.forEach(cid=>{
    const base=["settings",settingId,"children",cid];
    // Messages
    const qm=query(collection(db,...base,"messages"),orderBy("createdAt","desc"));
    let im=true;
    alertSubs.push(onSnapshot(qm,s=>{
      if(im){im=false;return;}
      if(!s.empty){
        const m=s.docs[0].data();
        const fromOther=role==="minder"?m.from==="parent":m.from==="fran";
        if(fromOther){
          if(!(state.activeChildId===cid&&state.currentTab==="chat")){
            if(role==="minder"){
              unread[cid]=(unread[cid]||0)+1;
              refreshDashboardBadge(cid);
            }
            pushNotif("💬 New message",m.text,cid,()=>navToChild(cid,settingId,role==="minder","chat"));
          }
        }
      }
    }));
    // Diary entries (parent view only)
    if(role==="parent"){
      const qd=query(collection(db,...base,"entries"),orderBy("createdAt","desc"));
      let id=true;
      alertSubs.push(onSnapshot(qd,s=>{
        if(id){id=false;return;}
        if(!s.empty&&!(state.activeChildId===cid&&state.currentTab==="diary")){
          const e=s.docs[0].data();
          pushNotif(`${TYPES[e.type]?.icon||"📝"} New diary update`,e.detail||"",cid,()=>navToChild(cid,settingId,false,"diary"));
        }
      }));
    }
  });
}
async function navToChild(cid,settingId,admin,tab){
  const snap=await getDoc(doc(db,"settings",settingId,"children",cid));
  if(snap.exists())openChild(cid,snap.data(),admin,tab);
}
function refreshDashboardBadge(cid){
  const el=document.querySelector(`[data-badge="${cid}"]`);
  if(!el)return;
  const count=unread[cid]||0;
  el.innerHTML=count>0?`<span class="badge">${count}</span>`:"";
}

/* ── auth gate ── */
onAuthStateChanged(auth,async user=>{
  clearSubs();
  if(!user){clearAlerts();renderAuth();return;}
  app.innerHTML='<div class="spin"></div>';
  try{
    const snap=await getDoc(doc(db,"users",user.uid));
    if(snap.exists()){
      state.profile=snap.data();state.settingId=state.profile.settingId;
      await requestNotifPermission();
      if(state.profile.role==="minder"){
        const kids=await getDocs(collection(db,"settings",state.settingId,"children"));
        initAlerts("minder",state.settingId,kids.docs.map(d=>d.id));
        renderMinderHome();
      }else{
        initAlerts("parent",state.settingId,state.profile.childIds||[]);
        renderParentHome();
      }
    }else{renderOnboarding(user);}
  }catch(e){app.innerHTML=`<div class="splash"><p class="err">${esc(e.message)}</p><button class="btn btn-ghost" id="so">Sign out</button></div>`;$("#so").onclick=()=>signOut(auth);}
});

/* ── auth screen ── */
function renderAuth(mode="in"){
  app.innerHTML=`
    <div class="splash fade">
      <div class="mark">🪺</div>
      <h1 style="font-size:42px">LittleNest</h1>
      <p class="muted" style="margin:4px 0 36px">The warm little app for childminders &amp; families</p>
      <div id="err"></div>
      ${mode==="up"?`<div class="field-row"><input id="uname" placeholder="Your full name" autocomplete="name"></div>`:""}
      <div class="field-row"><input id="email" type="email" placeholder="Email address" autocomplete="email"></div>
      <div class="field-row"><input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="${mode==="up"?"new-password":"current-password"}"></div>
      <div style="height:6px"></div>
      <button class="btn btn-primary" id="go">${mode==="up"?"Create account":"Sign in"}</button>
      <button class="btn btn-ghost" id="swap">${mode==="up"?"Already have an account? Sign in":"New here? Create an account"}</button>
    </div>`;
  $("#swap").onclick=()=>renderAuth(mode==="up"?"in":"up");
  $("#go").onclick=async()=>{
    const email=$("#email").value.trim().toLowerCase(),pw=$("#pw").value;
    const btn=$("#go");btn.disabled=true;btn.textContent="Please wait…";
    try{
      if(mode==="up"){
        const c=await createUserWithEmailAndPassword(auth,email,pw);
        const nm=($("#uname")?.value||"").trim();
        if(nm)await updateProfile(c.user,{displayName:nm});
      }else{await signInWithEmailAndPassword(auth,email,pw);}
    }catch(e){$("#err").innerHTML=`<div class="err">${esc(prettyErr(e))}</div>`;btn.disabled=false;btn.textContent=mode==="up"?"Create account":"Sign in";}
  };
}
function prettyErr(e){
  const m=(e.code||"").replace("auth/","");
  return({"invalid-email":"That email doesn't look right.","weak-password":"Password needs to be 6 or more characters.","email-already-in-use":"That email already has an account — try signing in.","invalid-credential":"Email or password not recognised.","invalid-login-credentials":"Email or password not recognised."}[m])||e.message;
}

/* ── onboarding ── */
function renderOnboarding(user){
  app.innerHTML=`
    <div class="splash fade">
      <div class="mark">🪺</div>
      <h1 style="font-size:34px">Welcome</h1>
      <p class="muted" style="margin:4px 0 32px">How will you be using LittleNest?</p>
      <button class="btn btn-primary" id="minder">I'm a childminder<span style="display:block;font-size:12px;font-weight:600;opacity:.9">Set up my setting</span></button>
      <button class="btn btn-ghost" id="parent">I'm a parent<span style="display:block;font-size:12px;font-weight:600;color:var(--sub)">Link to my child</span></button>
      <button class="btn btn-ghost" id="out" style="margin-top:18px;color:var(--sub)">Sign out</button>
    </div>`;
  $("#out").onclick=()=>signOut(auth);
  $("#minder").onclick=()=>{
    app.innerHTML=`
      <div class="splash fade">
        <h2 style="font-size:28px">Name your setting</h2>
        <p class="muted" style="margin:6px 0 22px">e.g. Francesca Minskip Childminding</p>
        <div class="field-row"><input id="sn" placeholder="Setting name"></div>
        <button class="btn btn-primary" id="create">Create setting</button>
      </div>`;
    $("#create").onclick=async()=>{
      const name=$("#sn").value.trim();if(!name)return;
      $("#create").disabled=true;
      const ref=await addDoc(collection(db,"settings"),{name,minderUid:user.uid,createdAt:serverTimestamp()});
      await setDoc(doc(db,"users",user.uid),{role:"minder",name:user.displayName||"",email:user.email,settingId:ref.id});
      state.profile={role:"minder",settingId:ref.id};state.settingId=ref.id;
      renderMinderHome();
    };
  };
  $("#parent").onclick=()=>renderParentLink(user);
}

/* ── parent link via code ── */
function renderParentLink(user,err=null){
  app.innerHTML=`
    <div class="splash fade">
      <div class="mark">🪺</div>
      <h2 style="font-size:26px">Link to your child</h2>
      <p class="muted" style="margin:10px 0 22px;line-height:1.5">Enter the setup code your childminder gave you.</p>
      ${err?`<div class="err">${esc(err)}</div>`:""}
      <div class="field-row"><input id="code" placeholder="e.g. LN-X4A2" style="text-align:center;font-family:monospace;font-size:22px;letter-spacing:3px;text-transform:uppercase"></div>
      <button class="btn btn-primary" id="link">Link my child</button>
      <button class="btn btn-ghost" id="out2" style="color:var(--sub)">Sign out</button>
    </div>`;
  $("#out2").onclick=()=>signOut(auth);
  $("#link").onclick=async()=>{
    const code=$("#code").value.trim().toUpperCase();if(!code)return;
    const btn=$("#link");btn.disabled=true;btn.textContent="Checking…";
    try{
      const invSnap=await getDoc(doc(db,"invites",code));
      if(!invSnap.exists()){renderParentLink(user,"Code not found — double-check it.");return;}
      if(invSnap.data().status==="used"){renderParentLink(user,"This code has already been used.");return;}
      const {settingId,childId}=invSnap.data();
      const email=(user.email||"").toLowerCase();
      await
