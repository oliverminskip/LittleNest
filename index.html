<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#6C4AE2"/>
<title>LittleNest</title>
<link rel="manifest" href="manifest.json"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
<link rel="apple-touch-icon" href="https://img.icons8.com/fluency/512/nest.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#F6F3FC;--card:#fff;--ink:#241B33;--sub:#7E7591;--violet:#6C4AE2;--vd:#5436C4;--lilac:#EEE8FB;--line:#ECE6F5;--gold:#C99A3C;--danger:#C0455B;--green:#1A7F4B;}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:var(--bg);background-image:radial-gradient(900px 380px at 50% -8%,rgba(108,74,226,.15),transparent);}
#app{max-width:480px;margin:0 auto;min-height:100vh;}
h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;letter-spacing:-.4px;margin:0;}
button{font-family:inherit;cursor:pointer;}
input,textarea,select{font-family:inherit;width:100%;border:1px solid var(--line);border-radius:14px;padding:13px;font-size:15px;background:#fff;outline:none;color:var(--ink);}
textarea{resize:none;line-height:1.45;}
input:focus,textarea:focus,select:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(108,74,226,.12);}
.screen{padding:22px 20px 130px;}
.muted{color:var(--sub);}
.center{text-align:center;}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:12px;box-shadow:0 1px 2px rgba(36,27,51,.04);overflow:hidden;}
.btn{display:block;width:100%;margin:0 0 12px;padding:15px 18px;border-radius:16px;border:none;font-size:16px;font-weight:800;}
.btn-primary{background:var(--violet);color:#fff;box-shadow:0 8px 22px rgba(108,74,226,.28);}
.btn-gold{background:var(--gold);color:#fff;}
.btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line);}
.btn-green{background:var(--green);color:#fff;}
.btn-danger{background:none;color:var(--danger);border:1px solid rgba(192,69,91,0.2);margin-top:24px;}
.btn[disabled]{opacity:.5;pointer-events:none;}
.row{display:flex;align-items:center;gap:13px;}
.avatar{width:46px;height:46px;border-radius:14px;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:20px;flex-shrink:0;}
.topbar{position:sticky;top:0;background:var(--bg);z-index:5;padding:20px 20px 12px;}
.back{background:none;border:none;color:var(--sub);font-weight:700;font-size:13px;padding:0;}
.tabs{display:flex;gap:6px;padding:0 20px 12px;overflow-x:auto;}
.tab{flex:1;min-width:0;padding:9px 4px;border-radius:12px;border:none;font-weight:800;font-size:13px;white-space:nowrap;background:#fff;color:var(--sub);box-shadow:inset 0 0 0 1px var(--line);}
.tab.on{background:var(--ink);color:#fff;box-shadow:none;}
.chip{padding:8px 13px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:13px;}
.chip.on{border:1.5px solid var(--violet);background:var(--lilac);color:var(--vd);}
.fab{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;border:none;border-radius:30px;padding:14px 26px;font-size:15px;font-weight:800;box-shadow:0 8px 24px rgba(36,27,51,.3);z-index:20;white-space:nowrap;}
.backdrop{position:fixed;inset:0;background:rgba(36,27,51,.45);display:flex;align-items:flex-end;justify-content:center;z-index:40;}
.sheet{width:100%;max-width:480px;background:var(--bg);border-radius:24px 24px 0 0;padding:16px 20px 32px;max-height:92vh;overflow-y:auto;}
.grab{width:40px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 16px;}
.iconbox{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0;}
.areatag{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:8px;font-size:11.5px;font-weight:800;color:#3a3346;}
.dot{width:7px;height:7px;border-radius:4px;display:inline-block;}
.badge{background:var(--danger);color:#fff;border-radius:20px;min-width:20px;height:20px;font-size:11px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;padding:0 5px;}
.bubble{max-width:78%;padding:9px 13px;border-radius:16px;font-size:14.5px;line-height:1.4;}
.bubble .t{font-size:10.5px;opacity:.7;margin-top:3px;text-align:right;}
.chatbar{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;padding:12px 14px;background:var(--bg);border-top:1px solid var(--line);display:flex;gap:8px;z-index:10;}
.err{color:var(--danger);font-size:13.5px;font-weight:700;margin:4px 0 12px;}
.next{margin-top:12px;padding:12px;border-radius:12px;background:#FBF4E3;border-left:3px solid var(--gold);}
.next .lbl{font-size:11px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px;}
.splash{padding:74px 28px;text-align:center;}
.mark{width:66px;height:66px;border-radius:21px;background:linear-gradient(145deg,#7C5CE6,#5436C4);margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 12px 34px rgba(84,54,196,.4);}
.fade{animation:rise .35s ease both;}
@keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--violet);border-radius:50%;animation:sp .8s linear infinite;margin:80px auto;}
@keyframes sp{to{transform:rotate(360deg);}}
.field-row{margin-bottom:14px;}
.field-label{font-size:12px;font-weight:800;color:var(--sub);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px;}
.info-card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px;}
.info-card .title{font-weight:800;font-size:14px;margin-bottom:8px;}
.info-row{display:flex;justify-content:space-between;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);}
.info-row:last-child{border-bottom:none;}
.info-row .label{font-size:13px;color:var(--sub);}
.info-row .value{font-size:13.5px;font-weight:700;text-align:right;}
.notif-bar{background:linear-gradient(135deg,var(--violet),var(--vd));color:#fff;border-radius:14px;padding:14px 16px;margin-bottom:16px;display:flex;align-items:center;gap:12px;}
.toast-banner{position:fixed;top:16px;left:50%;transform:translateX(-50%) translateY(-200px);width:calc(100% - 32px);max-width:440px;background:var(--ink);color:#fff;padding:14px 16px;border-radius:16px;box-shadow:0 12px 32px rgba(36,27,51,.24);z-index:999;display:flex;align-items:center;gap:12px;transition:transform 0.4s cubic-bezier(0.175,0.885,0.32,1.275);cursor:pointer;}
.toast-banner.show{transform:translateX(-50%) translateY(0);}
.green-box{background:#E8F7EE;border-radius:12px;padding:12px 14px;display:flex;align-items:center;gap:10px;margin:14px 0;}
</style>
</head>
<body>
<div id="app"><div class="spin"></div></div>
<div id="toast" class="toast-banner">
  <div style="font-size:22px" id="toast-icon">💬</div>
  <div style="flex:1">
    <div style="font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.5px;opacity:.7" id="toast-title"></div>
    <div style="font-size:14.5px;font-weight:600;margin-top:1px" id="toast-body"></div>
  </div>
</div>

<script>
window.onerror=function(msg,src,line){
  document.getElementById("app").innerHTML='<div style="padding:24px 20px;font-family:monospace;font-size:12px;color:#C0455B;background:#fff8f8;margin:20px;border-radius:12px"><b>Error (line '+line+'):</b><br>'+msg+'</div>';
};
window.onunhandledrejection=function(e){
  document.getElementById("app").innerHTML='<div style="padding:24px 20px;font-family:monospace;font-size:12px;color:#C0455B;background:#fff8f8;margin:20px;border-radius:12px"><b>Promise error:</b><br>'+(e.reason?.message||String(e.reason))+'</div>';
};
</script>

<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import{getAuth,onAuthStateChanged,createUserWithEmailAndPassword,signInWithEmailAndPassword,signOut,updateProfile}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import{getFirestore,doc,getDoc,getDocs,setDoc,addDoc,updateDoc,deleteDoc,collection,query,orderBy,onSnapshot,serverTimestamp,arrayUnion}from"https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig={apiKey:"AIzaSyCPl0p0di8yTNhZVPEP5SMYeR528kiYFrw",authDomain:"littlenest94.firebaseapp.com",projectId:"littlenest94",messagingSenderId:"8804693290",appId:"1:8804693290:web:cbd50128a876a043c79a53"};
const fb=initializeApp(firebaseConfig);
const auth=getAuth(fb);
const db=getFirestore(fb);

/* ── service worker ── */
if('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ── constants ── */
const AREAS={cl:{short:"C&L",label:"Communication & Language",prime:true,colour:"#7FA8C9"},pd:{short:"PD",label:"Physical Development",prime:true,colour:"#C26B4E"},psed:{short:"PSED",label:"Personal, Social & Emotional",prime:true,colour:"#D9A441"},lit:{short:"Lit",label:"Literacy",prime:false,colour:"#8E6BA8"},ma:{short:"Maths",label:"Mathematics",prime:false,colour:"#5B9A8B"},utw:{short:"UtW",label:"Understanding the World",prime:false,colour:"#A8924E"},ead:{short:"EAD",label:"Expressive Arts & Design",prime:false,colour:"#C76B8A"}};
const TYPES={meal:{label:"Meal",icon:"🍽️",tint:"#EEE8FB"},nap:{label:"Nap",icon:"😴",tint:"#E4ECF4"},nappy:{label:"Nappy",icon:"🧷",tint:"#EDE6F4"},activity:{label:"Activity",icon:"🧩",tint:"#E5F1E6"},mood:{label:"Mood",icon:"😊",tint:"#FBF1DC"},note:{label:"Note",icon:"📝",tint:"#F2ECE6"}};
const COLOURS=["#6C4AE2","#5B7B6F","#C26B4E","#9A7BB0","#D9A441","#5B9A8B"];
const ICON="https://img.icons8.com/fluency/512/nest.png";

/* ── helpers ── */
const $=(s,r=document)=>r.querySelector(s);
const app=$("#app");
const esc=s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtTime=ts=>{const d=ts?.toDate?ts.toDate():new Date();return d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"});};
const fmtDate=ts=>{const d=ts?.toDate?ts.toDate():new Date();const t=new Date();return d.toDateString()===t.toDateString()?"Today":d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"});};
const phoneForWA=p=>{if(!p)return null;const c=p.replace(/\D/g,"");if(c.startsWith("07"))return"44"+c.slice(1);if(c.startsWith("44"))return c;return c;};

/* ── state ── */
let state={profile:null,settingId:null,activeChildId:null,currentTab:null};
let subs=[],alertSubs=[];
let unread={};  // {childId: count} — in-memory unread badges
const clearSubs=()=>{subs.forEach(u=>u&&u());subs=[];};
const clearAlerts=()=>{alertSubs.forEach(u=>u&&u());alertSubs=[];};

/* ── notifications ── */
async function requestNotifPermission(){
  if(!('Notification' in window))return;
  if(Notification.permission==='default') await Notification.requestPermission();
}
function pushNotif(title,body,childId,onClick){
  // In-app toast always fires
  toast(title,body,onClick);
  // Native notification if permission granted
  if(Notification.permission==='granted'){
    try{
      const n=new Notification("LittleNest 🪺",{body:`${title}: ${body}`,icon:ICON,badge:ICON,tag:childId||"ln",renotify:true});
      n.onclick=()=>{window.focus();n.close();if(onClick)onClick();};
    }catch(e){}
  }
}

/* ── toast ── */
function toast(title,body,onClick){
  const t=$("#toast");
  $("#toast-title").textContent=title;
  $("#toast-body").textContent=(body||"").length>55?(body||"").slice(0,52)+"...":(body||"");
  t.classList.add("show");
  t.onclick=()=>{t.classList.remove("show");if(onClick)onClick();};
  setTimeout(()=>t.classList.remove("show"),5500);
}

/* ── cross-feed alerts ── */
function initAlerts(role,settingId,childIds=[]){
  clearAlerts();
  childIds.forEach(cid=>{
    const base=["settings",settingId,"children",cid];
    // Messages
    const qm=query(collection(db,...base,"messages"),orderBy("createdAt","desc"));
    let im=true;
    alertSubs.push(onSnapshot(qm,s=>{
      if(im){im=false;return;}
      if(!s.empty){
        const m=s.docs[0].data();
        const fromOther=role==="minder"?m.from==="parent":m.from==="fran";
        if(fromOther){
          if(!(state.activeChildId===cid&&state.currentTab==="chat")){
            if(role==="minder"){
              unread[cid]=(unread[cid]||0)+1;
              refreshDashboardBadge(cid);
            }
            pushNotif("💬 New message",m.text,cid,()=>navToChild(cid,settingId,role==="minder","chat"));
          }
        }
      }
    }));
    // Diary entries (parent view only)
    if(role==="parent"){
      const qd=query(collection(db,...base,"entries"),orderBy("createdAt","desc"));
      let id=true;
      alertSubs.push(onSnapshot(qd,s=>{
        if(id){id=false;return;}
        if(!s.empty&&!(state.activeChildId===cid&&state.currentTab==="diary")){
          const e=s.docs[0].data();
          pushNotif(`${TYPES[e.type]?.icon||"📝"} New diary update`,e.detail||"",cid,()=>navToChild(cid,settingId,false,"diary"));
        }
      }));
    }
  });
}
async function navToChild(cid,settingId,admin,tab){
  const snap=await getDoc(doc(db,"settings",settingId,"children",cid));
  if(snap.exists())openChild(cid,snap.data(),admin,tab);
}
function refreshDashboardBadge(cid){
  const el=document.querySelector(`[data-badge="${cid}"]`);
  if(!el)return;
  const count=unread[cid]||0;
  el.innerHTML=count>0?`<span class="badge">${count}</span>`:"";
}

/* ── auth gate ── */
onAuthStateChanged(auth,async user=>{
  clearSubs();
  if(!user){clearAlerts();renderAuth();return;}
  app.innerHTML='<div class="spin"></div><p style="text-align:center;margin-top:0;padding:0 20px"><button onclick="import(\'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js\').then(m=>m.signOut(getAuth()))" style="background:none;border:none;color:#7E7591;font-size:13px;font-family:inherit;cursor:pointer;text-decoration:underline">Having trouble? Tap to sign out</button></p>';
  // Sign out helper accessible from inline onclick
  window._signOut=()=>signOut(auth);
  app.querySelector('button')&&(app.querySelector('button').onclick=()=>signOut(auth));
  // Timeout — if Firebase doesn't respond in 8s, force sign out
  const timeout=setTimeout(()=>signOut(auth),8000);
  try{
    const snap=await getDoc(doc(db,"users",user.uid));
    clearTimeout(timeout);
    if(snap.exists()){
      state.profile=snap.data();state.settingId=state.profile.settingId;
      await requestNotifPermission();
      if(state.profile.role==="minder"){
        const kids=await getDocs(collection(db,"settings",state.settingId,"children"));
        initAlerts("minder",state.settingId,kids.docs.map(d=>d.id));
        renderMinderHome();
      }else{
        initAlerts("parent",state.settingId,state.profile.childIds||[]);
        renderParentHome();
      }
    }else{renderOnboarding(user);}
  }catch(e){clearTimeout(timeout);app.innerHTML=`<div class="splash"><p class="err">${esc(e.message)}</p><button class="btn btn-ghost" id="so">Sign out</button></div>`;$("#so").onclick=()=>signOut(auth);}
});

/* ── auth screen ── */
function renderAuth(mode="in"){
  app.innerHTML=`
    <div class="splash fade">
      <div class="mark">🪺</div>
      <h1 style="font-size:42px">LittleNest</h1>
      <p class="muted" style="margin:4px 0 36px">The warm little app for childminders &amp; families</p>
      <div id="err"></div>
      ${mode==="up"?`<div class="field-row"><input id="uname" placeholder="Your full name" autocomplete="name"></div>`:""}
      <div class="field-row"><input id="email" type="email" placeholder="Email address" autocomplete="email"></div>
      <div class="field-row"><input id="pw" type="password" placeholder="Password (6+ characters)" autocomplete="${mode==="up"?"new-password":"current-password"}"></div>
      <div style="height:6px"></div>
      <button class="btn btn-primary" id="go">${mode==="up"?"Create account":"Sign in"}</button>
      <button class="btn btn-ghost" id="swap">${mode==="up"?"Already have an account? Sign in":"New here? Create an account"}</button>
    </div>`;
  $("#swap").onclick=()=>renderAuth(mode==="up"?"in":"up");
  $("#go").onclick=async()=>{
    const email=$("#email").value.trim().toLowerCase(),pw=$("#pw").value;
    const btn=$("#go");btn.disabled=true;btn.textContent="Please wait…";
    try{
      if(mode==="up"){
        const c=await createUserWithEmailAndPassword(auth,email,pw);
        const nm=($("#uname")?.value||"").trim();
        if(nm)await updateProfile(c.user,{displayName:nm});
      }else{await signInWithEmailAndPassword(auth,email,pw);}
    }catch(e){$("#err").innerHTML=`<div class="err">${esc(prettyErr(e))}</div>`;btn.disabled=false;btn.textContent=mode==="up"?"Create account":"Sign in";}
  };
}
function prettyErr(e){
  const m=(e.code||"").replace("auth/","");
  return({"invalid-email":"That email doesn't look right.","weak-password":"Password needs to be 6 or more characters.","email-already-in-use":"That email already has an account — try signing in.","invalid-credential":"Email or password not recognised.","invalid-login-credentials":"Email or password not recognised."}[m])||e.message;
}

/* ── onboarding ── */
function renderOnboarding(user){
  app.innerHTML=`
    <div class="splash fade">
      <div class="mark">🪺</div>
      <h1 style="font-size:34px">Welcome</h1>
      <p class="muted" style="margin:4px 0 32px">How will you be using LittleNest?</p>
      <button class="btn btn-primary" id="minder">I'm a childminder<span style="display:block;font-size:12px;font-weight:600;opacity:.9">Set up my setting</span></button>
      <button class="btn btn-ghost" id="parent">I'm a parent<span style="display:block;font-size:12px;font-weight:600;color:var(--sub)">Link to my child</span></button>
      <button class="btn btn-ghost" id="out" style="margin-top:18px;color:var(--sub)">Sign out</button>
    </div>`;
  $("#out").onclick=()=>signOut(auth);
  $("#minder").onclick=()=>{
    app.innerHTML=`
      <div class="splash fade">
        <h2 style="font-size:28px">Name your setting</h2>
        <p class="muted" style="margin:6px 0 22px">e.g. Francesca Minskip Childminding</p>
        <div class="field-row"><input id="sn" placeholder="Setting name"></div>
        <button class="btn btn-primary" id="create">Create setting</button>
      </div>`;
    $("#create").onclick=async()=>{
      const name=$("#sn").value.trim();if(!name)return;
      $("#create").disabled=true;
      const ref=await addDoc(collection(db,"settings"),{name,minderUid:user.uid,createdAt:serverTimestamp()});
      await setDoc(doc(db,"users",user.uid),{role:"minder",name:user.displayName||"",email:user.email,settingId:ref.id});
      state.profile={role:"minder",settingId:ref.id};state.settingId=ref.id;
      renderMinderHome();
    };
  };
  $("#parent").onclick=()=>renderParentLink(user);
}

/* ── parent link via code ── */
function renderParentLink(user,err=null){
  app.innerHTML=`
    <div class="splash fade">
      <div class="mark">🪺</div>
      <h2 style="font-size:26px">Link to your child</h2>
      <p class="muted" style="margin:10px 0 22px;line-height:1.5">Enter the setup code your childminder gave you.</p>
      ${err?`<div class="err">${esc(err)}</div>`:""}
      <div class="field-row"><input id="code" placeholder="e.g. LN-X4A2" style="text-align:center;font-family:monospace;font-size:22px;letter-spacing:3px;text-transform:uppercase"></div>
      <button class="btn btn-primary" id="link">Link my child</button>
      <button class="btn btn-ghost" id="out2" style="color:var(--sub)">Sign out</button>
    </div>`;
  $("#out2").onclick=()=>signOut(auth);
  $("#link").onclick=async()=>{
    const code=$("#code").value.trim().toUpperCase();if(!code)return;
    const btn=$("#link");btn.disabled=true;btn.textContent="Checking…";
    try{
      const invSnap=await getDoc(doc(db,"invites",code));
      if(!invSnap.exists()){renderParentLink(user,"Code not found — double-check it.");return;}
      if(invSnap.data().status==="used"){renderParentLink(user,"This code has already been used.");return;}
      const {settingId,childId}=invSnap.data();
      const email=(user.email||"").toLowerCase();
      await updateDoc(doc(db,"settings",settingId,"children",childId),{parentUids:arrayUnion(user.uid),parentEmails:arrayUnion(email)});
      await updateDoc(doc(db,"invites",code),{status:"used",usedBy:user.uid,usedAt:serverTimestamp()});
      const childIds=[childId];
      await setDoc(doc(db,"users",user.uid),{role:"parent",name:user.displayName||"",email,settingId,childIds});
      state.profile={role:"parent",settingId,childIds};state.settingId=settingId;
      initAlerts("parent",settingId,childIds);
      renderParentProfileSetup(settingId,childId,invSnap.data().childName||"your child");
    }catch(e){renderParentLink(user,e.message);}
  };
}

/* ── parent profile setup (shown once after linking) ── */
function renderParentProfileSetup(settingId,childId,childName){
  app.innerHTML=`
    <div class="screen fade" style="padding-top:40px">
      <h2 style="font-size:28px;margin-bottom:6px">One more step</h2>
      <p class="muted" style="margin:0 0 24px;line-height:1.5">Help ${esc(childName)}'s childminder have your details to hand. You can update these any time.</p>
      <div class="field-row"><div class="field-label">Your full name</div><input id="pname" placeholder="e.g. Sophie Harper" value="${esc(auth.currentUser?.displayName||"")}"></div>
      <div class="field-row"><div class="field-label">Your mobile number</div><input id="pphone" type="tel" placeholder="e.g. 07700 900123"></div>
      <div class="field-row"><div class="field-label">Emergency contact name</div><input id="ename" placeholder="e.g. James Harper"></div>
      <div class="field-row"><div class="field-label">Emergency contact number</div><input id="ephone" type="tel" placeholder="e.g. 07700 900456"></div>
      <div class="field-row"><div class="field-label">Medical notes (optional)</div><textarea id="medical" rows="2" placeholder="Allergies, medication, GP details…"></textarea></div>
      <div style="height:8px"></div>
      <button class="btn btn-primary" id="saveprofile">Save &amp; continue</button>
      <button class="btn btn-ghost" id="skipprofile" style="color:var(--sub)">Skip for now</button>
    </div>`;
  const save=async(skip)=>{
    if(!skip){
      const updates={};
      const pname=$("#pname").value.trim();const pphone=$("#pphone").value.trim();
      const ename=$("#ename").value.trim();const ephone=$("#ephone").value.trim();
      const medical=$("#medical").value.trim();
      if(pname)updates.parentName=pname;
      if(pphone)updates.parentPhone=pphone;
      if(ename)updates.emergencyName=ename;
      if(ephone)updates.emergencyPhone=ephone;
      if(medical)updates.medicalNotes=medical;
      if(Object.keys(updates).length>0){
        try{await updateDoc(doc(db,"settings",settingId,"children",childId),updates);}catch(e){}
      }
    }
    renderParentHome();
  };
  $("#saveprofile").onclick=()=>save(false);
  $("#skipprofile").onclick=()=>save(true);
}

/* ── minder home ── */
function renderMinderHome(){
  clearSubs();
  state.activeChildId=null;state.currentTab=null;
  app.innerHTML=`
    <div class="topbar">
      <button class="back" id="out">Sign out</button>
      <h1 style="font-size:30px;color:var(--violet);margin-top:6px">Today</h1>
      <p class="muted" style="margin:2px 0 0;font-weight:600" id="sub">Loading…</p>
    </div>
    <div class="screen" style="padding-top:6px" id="list"><div class="spin"></div></div>
    <button class="fab" id="add">＋ Add child</button>`;
  $("#out").onclick=()=>signOut(auth);
  $("#add").onclick=openAddChild;
  const q=query(collection(db,"settings",state.settingId,"children"),orderBy("createdAt"));
  subs.push(onSnapshot(q,snap=>{
    $("#sub").textContent=`${snap.size} ${snap.size===1?"child":"children"} in today`;
    initAlerts("minder",state.settingId,snap.docs.map(d=>d.id));
    if(snap.empty){$("#list").innerHTML=`<p class="muted center" style="padding:46px 0">No children yet.<br>Tap "Add child" to begin.</p>`;return;}
    $("#list").innerHTML=snap.docs.map(d=>{
      const c=d.data();
      const uc=unread[d.id]||0;
      return `<button class="card row fade" style="width:100%;padding:13px;border:1px solid var(--line);background:#fff;text-align:left" data-id="${d.id}">
        <div class="avatar" style="background:${c.colour||'#6C4AE2'}">${esc((c.name||"?")[0])}</div>
        <div style="flex:1;min-width:0">
          <div style="font-weight:800;font-size:17px">${esc(c.name)}</div>
          <div class="muted" style="font-size:12.5px">${esc(c.dob||"")}${c.setupCode?` · Code: <span style="font-family:monospace;color:var(--gold)">${esc(c.setupCode)}</span>`:""}${c.parentName?` · <span style="color:var(--ink)">${esc(c.parentName)}</span>`:""}</div>
        </div>
        <div style="display:flex;align-items:center;gap:6px">
          <span data-badge="${d.id}">${uc>0?`<span class="badge">${uc}</span>`:""}</span>
          <span class="muted" style="font-size:22px">›</span>
        </div></button>`;
    }).join("");
    $("#list").querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{
      const d=snap.docs.find(x=>x.id===b.dataset.id);
      openChild(b.dataset.id,d.data(),true);
    });
  },err=>{$("#list").innerHTML=`<p class="err">${esc(err.message)}</p>`;}));
}

/* ── add child ── */
function openAddChild(){
  const sheet=mountSheet("Add a child",`
    <div class="field-row"><div class="field-label">Child's name</div><input id="cn" placeholder="e.g. Evie Harper"></div>
    <div class="field-row"><div class="field-label">Date of birth or age</div><input id="dob" placeholder="e.g. 2y 4m or 12/03/2022"></div>
    <p class="muted" style="font-size:12.5px;line-height:1.5;margin:0 0 18px">A unique code is generated automatically. Share it with the parent — they enter it when they sign up and are instantly linked.</p>
    <button class="btn btn-primary" id="save">Add child &amp; generate code</button>`);
  $("#save").onclick=async()=>{
    const name=$("#cn").value.trim();if(!name)return;
    $("#save").disabled=true;$("#save").textContent="Adding…";
    const code="LN-"+Math.random().toString(36).substring(2,6).toUpperCase();
    const colour=COLOURS[Math.floor(Math.random()*COLOURS.length)];
    const childRef=await addDoc(collection(db,"settings",state.settingId,"children"),{name,dob:$("#dob").value.trim(),colour,parentEmails:[],parentUids:[],setupCode:code,createdAt:serverTimestamp()});
    await setDoc(doc(db,"invites",code),{settingId:state.settingId,childId:childRef.id,childName:name,status:"pending",createdAt:serverTimestamp()});
    sheet.remove();
  };
}

/* ── parent home ── */
async function renderParentHome(){
  clearSubs();
  state.activeChildId=null;state.currentTab=null;
  app.innerHTML='<div class="spin"></div>';
  try{
    const ids=state.profile.childIds||[];
    const kids=[];
    for(const id of ids){
      const s=await getDoc(doc(db,"settings",state.settingId,"children",id));
      if(s.exists())kids.push({id,...s.data()});
    }
    if(kids.length===1){openChild(kids[0].id,kids[0],false);return;}
    app.innerHTML=`
      <div class="topbar"><button class="back" id="out">Sign out</button>
        <h1 style="font-size:30px;color:var(--violet);margin-top:6px">My children</h1></div>
      <div class="screen" style="padding-top:6px" id="list"></div>`;
    $("#out").onclick=()=>signOut(auth);
    $("#list").innerHTML=kids.map(c=>`
      <button class="card row" style="width:100%;padding:13px;border:1px solid var(--line);background:#fff;text-align:left" data-id="${c.id}">
        <div class="avatar" style="background:${c.colour||'#6C4AE2'}">${esc((c.name||"?")[0])}</div>
        <div style="flex:1"><div style="font-weight:800;font-size:17px">${esc(c.name)}</div></div>
        <span class="muted" style="font-size:22px">›</span></button>`).join("");
    $("#list").querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{
      const c=kids.find(x=>x.id===b.dataset.id);openChild(c.id,c,false);
    });
  }catch(e){app.innerHTML=`<div class="splash"><p class="err">${esc(e.message)}</p></div>`;}
}

/* ── child detail ── */
function openChild(childId,child,admin,forcedTab=null){
  clearSubs();
  let tab=forcedTab||"diary";
  state.activeChildId=childId;state.currentTab=tab;
  if(admin&&unread[childId]&&tab==="chat"){unread[childId]=0;refreshDashboardBadge(childId);}
  const base=["settings",state.settingId,"children",childId];
  const tabs=admin
    ?[{k:"diary",l:"Diary"},{k:"journey",l:"Journey"},{k:"messages",l:"Messages"},{k:"profile",l:"Profile"}]
    :[{k:"diary",l:"Diary"},{k:"journey",l:"Journey"},{k:"messages",l:"Messages"},{k:"profile",l:"My details"}];

  app.innerHTML=`
    <div class="topbar">
      <button class="back" id="back">‹ ${admin?"All children":"My children"}</button>
      <h1 style="font-size:30px;color:${child.colour||'var(--violet)'};margin-top:6px">${esc(child.name)}</h1>
      <p class="muted" style="margin:2px 0 0;font-weight:600">${admin?"Childminder view":"Today"}</p>
    </div>
    <div class="tabs">${tabs.map(t=>`<button class="tab${tab===t.k?" on":""}" data-t="${t.k}">${t.l}</button>`).join("")}</div>
    <div id="body" class="screen" style="padding-top:0"></div>
    <div id="fabwrap"></div>`;

  $("#back").onclick=()=>{
    if(admin)renderMinderHome();else renderParentHome();
  };
  app.querySelectorAll(".tab").forEach(t=>t.onclick=()=>{
    tab=t.dataset.t;state.currentTab=tab;
    if(admin&&tab==="messages"){unread[childId]=0;refreshDashboardBadge(childId);}
    app.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===t));
    mount();
  });
  mount();

  function mount(){
    clearSubs();
    const body=$("#body"),fw=$("#fabwrap");fw.innerHTML="";
    if(tab==="diary")    mountDiary(body,fw);
    if(tab==="journey")  mountJourney(body,fw);
    if(tab==="messages") mountChat(body);
    if(tab==="profile")  mountProfile(body,admin,childId,child);
  }

  /* diary */
  function mountDiary(body,fw){
    body.innerHTML='<div id="d"><div class="spin"></div></div>';
    const q=query(collection(db,...base,"entries"),orderBy("createdAt","desc"));
    subs.push(onSnapshot(q,s=>{
      const del=admin?`<button class="btn btn-danger" id="del">🗑️ Delete ${esc(child.name)}'s profile</button>`:"";
      $("#d").innerHTML=(s.empty?`<p class="muted center" style="padding:46px 0">No updates yet today.</p>`:s.docs.map(d=>entryCard(d.data())).join(""))+del;
      if(admin){
        const db_=$('#del');if(!db_)return;
        db_.onclick=async()=>{
          if(!confirm(`Permanently delete ${child.name}'s profile and all records?`))return;
          db_.disabled=true;db_.textContent="Deleting…";
          try{
            await deleteDoc(doc(db,"settings",state.settingId,"children",childId));
            if(child.setupCode)await deleteDoc(doc(db,"invites",child.setupCode));
            renderMinderHome();
          }catch(e){alert(e.message);db_.disabled=false;db_.textContent=`🗑️ Delete ${child.name}'s profile`;}
        };
      }
    }));
    if(admin){fw.innerHTML=`<button class="fab" id="addE">＋ Add update</button>`;$("#addE").onclick=()=>openDiaryComposer(base,child.name,childId);}
  }

  /* journey */
  function mountJourney(body,fw){
    body.innerHTML=`${admin?"":`<p class="muted" style="font-size:13px;margin:4px 0 14px;line-height:1.4">${esc(child.name)}'s learning journey — captured against the EYFS areas of learning.</p>`}<div id="j"><div class="spin"></div></div>`;
    const q=query(collection(db,...base,"observations"),orderBy("createdAt","desc"));
    subs.push(onSnapshot(q,s=>{
      if(s.empty){$("#j").innerHTML=`<p class="muted center" style="padding:46px 0">No observations yet.</p>`;return;}
      $("#j").innerHTML=s.docs.map(d=>obsCard(d.data())).join("");
    }));
    if(admin){fw.innerHTML=`<button class="fab" id="addO">＋ New observation</button>`;$("#addO").onclick=()=>openObsComposer(base);}
  }

  /* chat */
  function mountChat(body){
    body.innerHTML=`<div id="c" style="padding-bottom:70px"><div class="spin"></div></div>
      <div class="chatbar"><input id="msg" placeholder="Message…"><button class="btn btn-primary" id="send" style="width:auto;margin:0;padding:11px 20px">Send</button></div>`;
    const q=query(collection(db,...base,"messages"),orderBy("createdAt"));
    const me=admin?"fran":"parent";
    subs.push(onSnapshot(q,s=>{
      $("#c").innerHTML=s.empty?`<p class="muted center" style="padding:46px 0">No messages yet.</p>`:
        s.docs.map(d=>{const m=d.data(),mine=m.from===me;
          return `<div style="display:flex;justify-content:${mine?"flex-end":"flex-start"};margin-bottom:8px">
            <div class="bubble" style="background:${mine?"var(--violet)":"#fff"};color:${mine?"#fff":"var(--ink)"};${mine?"":"border:1px solid var(--line)"}">${esc(m.text)}<div class="t">${fmtTime(m.createdAt)}</div></div></div>`;
        }).join("");
      $("#c").scrollTop=1e9;
    }));
    const send=async()=>{const v=$("#msg").value.trim();if(!v)return;$("#msg").value="";
      await addDoc(collection(db,...base,"messages"),{from:me,text:v,createdAt:serverTimestamp()});};
    $("#send").onclick=send;
    $("#msg").onkeydown=e=>{if(e.key==="Enter")send();};
  }

  /* profile tab */
  function mountProfile(body,admin,childId,child){
    const phone=child.parentPhone||"";
    const waPhone=phoneForWA(phone);

    if(admin){
      // Minder sees parent's details
      body.innerHTML=`
        <div class="info-card">
          <div class="title">👤 Parent details</div>
          <div class="info-row"><span class="label">Name</span><span class="value">${esc(child.parentName||"Not provided")}</span></div>
          <div class="info-row"><span class="label">Mobile</span><span class="value">${esc(child.parentPhone||"Not provided")}</span></div>
          <div class="info-row"><span class="label">Email</span><span class="value">${esc((child.parentEmails||[])[0]||"")}</span></div>
        </div>
        <div class="info-card">
          <div class="title">🚨 Emergency contact</div>
          <div class="info-row"><span class="label">Name</span><span class="value">${esc(child.emergencyName||"Not provided")}</span></div>
          <div class="info-row"><span class="label">Phone</span><span class="value">${esc(child.emergencyPhone||"Not provided")}</span></div>
        </div>
        ${child.medicalNotes?`<div class="info-card"><div class="title">🏥 Medical notes</div><p style="font-size:14px;line-height:1.5;margin:4px 0">${esc(child.medicalNotes)}</p></div>`:""}
        ${waPhone?`<button class="btn btn-green" id="wa" style="margin-top:8px">💬 WhatsApp ${esc(child.parentName||"parent")}</button>`:`<p class="muted center" style="font-size:13px;margin-top:16px">Parent hasn't added their mobile yet.</p>`}`;
      if(waPhone){
        $("#wa").onclick=()=>{
          const msg=`Hi ${child.parentName||""}! Just a quick update from LittleNest 🪺`;
          window.open(`https://wa.me/${waPhone}?text=${encodeURIComponent(msg)}`,"_blank");
        };
      }
    } else {
      // Parent sees and can edit their own details
      const uid=auth.currentUser?.uid;
      body.innerHTML=`
        <div style="margin-bottom:16px">
          <div class="field-label">Your name</div>
          <input id="pname" value="${esc(child.parentName||"")}" placeholder="Full name">
        </div>
        <div style="margin-bottom:16px">
          <div class="field-label">Your mobile</div>
          <input id="pphone" type="tel" value="${esc(child.parentPhone||"")}" placeholder="07700 900123">
        </div>
        <div style="margin-bottom:16px">
          <div class="field-label">Emergency contact name</div>
          <input id="ename" value="${esc(child.emergencyName||"")}" placeholder="Name">
        </div>
        <div style="margin-bottom:16px">
          <div class="field-label">Emergency contact number</div>
          <input id="ephone" type="tel" value="${esc(child.emergencyPhone||"")}" placeholder="07700 900456">
        </div>
        <div style="margin-bottom:20px">
          <div class="field-label">Medical notes</div>
          <textarea id="medical" rows="3" placeholder="Allergies, medication, GP details…">${esc(child.medicalNotes||"")}</textarea>
        </div>
        <button class="btn btn-primary" id="savedet">Save details</button>`;
      $("#savedet").onclick=async()=>{
        const btn=$("#savedet");btn.disabled=true;btn.textContent="Saving…";
        try{
          await updateDoc(doc(db,"settings",state.settingId,"children",childId),{
            parentName:$("#pname").value.trim(),
            parentPhone:$("#pphone").value.trim(),
            emergencyName:$("#ename").value.trim(),
            emergencyPhone:$("#ephone").value.trim(),
            medicalNotes:$("#medical").value.trim()
          });
          btn.textContent="✓ Saved";
          setTimeout(()=>{btn.disabled=false;btn.textContent="Save details";},2000);
          // Update local child object so minder sees fresh data on next profile view
          child.parentName=$("#pname").value.trim();
          child.parentPhone=$("#pphone").value.trim();
        }catch(e){btn.disabled=false;btn.textContent="Save details";alert(e.message);}
      };
    }
  }
}

/* ── cards ── */
function entryCard(e){
  const t=TYPES[e.type]||TYPES.note;
  return `<div class="card fade"><div style="padding:14px;display:flex;gap:12px">
    <div class="iconbox" style="background:${t.tint}">${t.icon}</div>
    <div style="flex:1">
      <div style="display:flex;justify-content:space-between;align-items:baseline">
        <span style="font-weight:800;font-size:14px">${t.label}</span>
        <span class="muted" style="font-size:12px;font-weight:700">${fmtTime(e.createdAt)}</span>
      </div>
      ${e.detail?`<div style="font-size:14.5px;line-height:1.45;margin-top:2px">${esc(e.detail)}</div>`:""}
    </div></div></div>`;
}
function obsCard(o){
  return `<div class="card fade"><div style="padding:16px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px">
      <span style="font-family:'Fraunces',serif;font-weight:600;font-size:18px">${esc(o.title)}</span>
      <span class="muted" style="font-size:12px;font-weight:700">${fmtDate(o.createdAt)}</span>
    </div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px">${(o.areas||[]).map(areaTag).join("")}</div>
    <div style="font-size:14.5px;line-height:1.5">${esc(o.note)}</div>
    ${o.nextSteps?`<div class="next"><div class="lbl">Next steps</div><div style="font-size:13.5px;line-height:1.45">${esc(o.nextSteps)}</div></div>`:""}
  </div></div>`;
}
function areaTag(a){const x=AREAS[a];if(!x)return"";
  return `<span class="areatag" style="background:${x.colour}22"><span class="dot" style="background:${x.colour}"></span>${x.short}</span>`;}

/* ── composers ── */
function openDiaryComposer(base,childName,childId){
  let type="meal";
  // Get parent phone from child doc for WhatsApp
  let parentPhone=null;
  getDoc(doc(db,...base.slice(0,-2),...base.slice(-2))).then(s=>{if(s.exists())parentPhone=s.data().parentPhone;}).catch(()=>{});
  // Actually base is ["settings",sid,"children",cid] so:
  getDoc(doc(db,"settings",state.settingId,"children",childId)).then(s=>{if(s.exists())parentPhone=s.data().parentPhone;}).catch(()=>{});

  const sheet=mountSheet("New update",`
    <div style="display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px" id="types">
      ${Object.entries(TYPES).map(([k,v])=>`<button class="chip${k==="meal"?" on":""}" data-k="${k}">${v.icon} ${v.label}</button>`).join("")}
    </div>
    <textarea id="detail" rows="3" placeholder="What happened? e.g. Had a big lunch and went down well for a nap…"></textarea>
    <div class="green-box">
      <input type="checkbox" id="wa" style="width:auto;cursor:pointer">
      <label for="wa" style="font-size:13.5px;font-weight:700;color:var(--green);cursor:pointer">📢 Also alert via WhatsApp</label>
    </div>
    <button class="btn btn-primary" id="save">Post to parent</button>`);
  sheet.querySelectorAll(".chip").forEach(c=>c.onclick=()=>{type=c.dataset.k;sheet.querySelectorAll(".chip").forEach(x=>x.classList.toggle("on",x===c));});
  $("#save").onclick=async()=>{
    const detail=$("#detail").value.trim();if(!detail)return;
    $("#save").disabled=true;$("#save").textContent="Posting…";
    await addDoc(collection(db,...base,"entries"),{type,detail,createdAt:serverTimestamp()});
    if($("#wa").checked){
      const msg=`Hi! New ${TYPES[type]?.label||"update"} for ${childName} on LittleNest ${TYPES[type]?.icon||"📝"}\n\n"${detail}"`;
      const waNum=phoneForWA(parentPhone);
      const url=waNum?`https://wa.me/${waNum}?text=${encodeURIComponent(msg)}`:`https://api.whatsapp.com/send?text=${encodeURIComponent(msg)}`;
      window.open(url,"_blank");
    }
    sheet.remove();
  };
}

function openObsComposer(base){
  let areas=[];
  const sheet=mountSheet("New observation",`
    <div class="field-row"><input id="title" placeholder="Title — e.g. Building a tall tower"></div>
    <div class="field-row"><textarea id="note" rows="4" placeholder="What did you see? Describe the moment…"></textarea></div>
    <div class="field-label" style="margin-bottom:8px">EYFS areas of learning</div>
    <div id="areas" style="display:flex;flex-wrap:wrap;gap:7px;margin-bottom:16px">
      ${Object.entries(AREAS).map(([k,v])=>`<button class="chip" data-k="${k}"><span class="dot" style="background:${v.colour};margin-right:6px;vertical-align:middle"></span>${v.short}${v.prime?'<span class="muted" style="font-weight:600"> ·prime</span>':""}</button>`).join("")}
    </div>
    <div class="field-row"><textarea id="next" rows="2" placeholder="Next steps (optional) — how will you extend this?"></textarea></div>
    <button class="btn btn-gold" id="save">Save to journey</button>`);
  sheet.querySelectorAll("#areas .chip").forEach(c=>c.onclick=()=>{
    const k=c.dataset.k;
    if(areas.includes(k)){areas=areas.filter(x=>x!==k);c.classList.remove("on");}
    else{areas.push(k);c.classList.add("on");}
  });
  $("#save").onclick=async()=>{
    const title=$("#title").value.trim(),note=$("#note").value.trim();
    if(!title||!note||!areas.length){alert("Add a title, a note and at least one EYFS area.");return;}
    $("#save").disabled=true;$("#save").textContent="Saving…";
    await addDoc(collection(db,...base,"observations"),{title,note,areas,nextSteps:$("#next").value.trim(),createdAt:serverTimestamp()});
    sheet.remove();
  };
}

function mountSheet(title,inner){
  const bd=document.createElement("div");bd.className="backdrop";
  bd.innerHTML=`<div class="sheet fade"><div class="grab"></div><h3 style="font-size:23px;margin-bottom:16px">${title}</h3>${inner}</div>`;
  bd.onclick=e=>{if(e.target===bd)bd.remove();};
  document.body.appendChild(bd);
  return bd;
}
</script>
</body>
</html>
