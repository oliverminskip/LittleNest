<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#6C4AE2" />
<title>LittleNest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F3FC; --card:#FFFFFF; --ink:#241B33; --sub:#7E7591;
    --violet:#6C4AE2; --violetDeep:#5436C4; --lilac:#EEE8FB; --line:#ECE6F5;
    --gold:#C99A3C; --danger:#C0455B;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    font-family:'Nunito',system-ui,sans-serif;color:var(--ink);background:var(--bg);
    background-image:radial-gradient(900px 380px at 50% -8%, rgba(108,74,226,.16), transparent);
  }
  #app{max-width:480px;margin:0 auto;min-height:100vh;position:relative;}
  h1,h2,h3{font-family:'Fraunces',serif;font-weight:600;letter-spacing:-.4px;margin:0;}
  button{font-family:inherit;cursor:pointer;}
  input,textarea{font-family:inherit;width:100%;border:1px solid var(--line);border-radius:14px;
    padding:13px;font-size:15px;background:#fff;outline:none;color:var(--ink);}
  textarea{resize:none;line-height:1.45;}
  input:focus,textarea:focus{border-color:var(--violet);box-shadow:0 0 0 3px rgba(108,74,226,.12);}
  .screen{padding:22px 20px 130px;}
  .muted{color:var(--sub);}
  .center{text-align:center;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:18px;margin-bottom:12px;
    box-shadow:0 1px 2px rgba(36,27,51,.04);overflow:hidden;}
  .btn{display:block;width:100%;margin:0 0 12px;padding:15px 18px;border-radius:16px;border:none;
    font-size:16px;font-weight:800;}
  .btn-primary{background:var(--violet);color:#fff;box-shadow:0 8px 22px rgba(108,74,226,.28);}
  .btn-gold{background:var(--gold);color:#fff;}
  .btn-ghost{background:#fff;color:var(--ink);border:1px solid var(--line);}
  .btn[disabled]{opacity:.5;}
  .row{display:flex;align-items:center;gap:13px;}
  .avatar{width:46px;height:46px;border-radius:14px;color:#fff;display:flex;align-items:center;
    justify-content:center;font-weight:800;font-size:20px;flex-shrink:0;}
  .topbar{position:sticky;top:0;background:var(--bg);z-index:5;padding:20px 20px 12px;}
  .back{background:none;border:none;color:var(--sub);font-weight:700;font-size:13px;padding:0;}
  .tabs{display:flex;gap:6px;padding:0 20px 12px;}
  .tab{flex:1;padding:9px 0;border-radius:12px;border:none;font-weight:800;font-size:13.5px;
    background:#fff;color:var(--sub);box-shadow:inset 0 0 0 1px var(--line);}
  .tab.on{background:var(--ink);color:#fff;box-shadow:none;}
  .chip{padding:8px 13px;border-radius:20px;border:1px solid var(--line);background:#fff;
    color:var(--ink);font-weight:700;font-size:13px;}
  .chip.on{border:1.5px solid var(--violet);background:var(--lilac);color:var(--violetDeep);}
  .fab{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;
    border:none;border-radius:30px;padding:14px 26px;font-size:15px;font-weight:800;
    box-shadow:0 8px 24px rgba(36,27,51,.3);z-index:20;}
  .backdrop{position:fixed;inset:0;background:rgba(36,27,51,.45);display:flex;align-items:flex-end;
    justify-content:center;z-index:40;}
  .sheet{width:100%;max-width:480px;background:var(--bg);border-radius:24px 24px 0 0;
    padding:16px 20px 28px;max-height:92vh;overflow-y:auto;}
  .grab{width:40px;height:4px;background:var(--line);border-radius:4px;margin:0 auto 16px;}
  .iconbox{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;
    justify-content:center;font-size:19px;flex-shrink:0;}
  .areatag{display:inline-flex;align-items:center;gap:5px;padding:4px 9px;border-radius:8px;
    font-size:11.5px;font-weight:800;color:#3a3346;}
  .dot{width:7px;height:7px;border-radius:4px;}
  .bubble{max-width:78%;padding:9px 13px;border-radius:16px;font-size:14.5px;line-height:1.4;}
  .bubble .t{font-size:10.5px;opacity:.7;margin-top:3px;text-align:right;}
  .chatbar{position:fixed;bottom:0;left:0;right:0;max-width:480px;margin:0 auto;padding:14px;
    background:var(--bg);border-top:1px solid var(--line);display:flex;gap:8px;}
  .err{color:var(--danger);font-size:13.5px;font-weight:700;margin:4px 0 12px;}
  .next{margin-top:12px;padding:12px;border-radius:12px;background:#FBF4E3;border-left:3px solid var(--gold);}
  .next .lbl{font-size:11px;font-weight:800;color:var(--gold);text-transform:uppercase;letter-spacing:1px;margin-bottom:3px;}
  .splash{padding:74px 28px;text-align:center;}
  .mark{width:66px;height:66px;border-radius:21px;background:linear-gradient(145deg,#7C5CE6,#5436C4);
    margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:32px;
    box-shadow:0 12px 34px rgba(84,54,196,.4);}
  .fade{animation:rise .35s ease both;}
  @keyframes rise{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--violet);
    border-radius:50%;animation:sp .8s linear infinite;margin:80px auto;}
  @keyframes sp{to{transform:rotate(360deg);}}
</style>
</head>
<body>
<div id="app"><div class="spin"></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged, createUserWithEmailAndPassword,
  signInWithEmailAndPassword, signOut, updateProfile }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, getDocs, setDoc, addDoc, updateDoc,
  collection, collectionGroup, query, where, orderBy, onSnapshot,
  serverTimestamp, arrayUnion }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ============================================================
   PASTE YOUR FIREBASE CONFIG HERE
   Firebase console → Project settings → Your apps → SDK setup
   ============================================================ */
const firebaseConfig = {
  apiKey: "AIzaSyCPl0p0di8yTNhZVPEP5SMYeR528kiYFrw",
  authDomain: "littlenest94.firebaseapp.com",
  projectId: "littlenest94",
  messagingSenderId: "8804693290",
  appId: "1:8804693290:web:cbd50128a876a043c79a53"
};

const fb = initializeApp(firebaseConfig);
const auth = getAuth(fb);
const db = getFirestore(fb);

/* ---------- constants ---------- */
const AREAS = {
  cl:  {short:"C&L", label:"Communication & Language",     prime:true,  colour:"#7FA8C9"},
  pd:  {short:"PD",  label:"Physical Development",         prime:true,  colour:"#C26B4E"},
  psed:{short:"PSED",label:"Personal, Social & Emotional", prime:true,  colour:"#D9A441"},
  lit: {short:"Lit", label:"Literacy",                     prime:false, colour:"#8E6BA8"},
  ma:  {short:"Maths",label:"Mathematics",                 prime:false, colour:"#5B9A8B"},
  utw: {short:"UtW", label:"Understanding the World",      prime:false, colour:"#A8924E"},
  ead: {short:"EAD", label:"Expressive Arts & Design",     prime:false, colour:"#C76B8A"},
};
const TYPES = {
  meal:    {label:"Meal",     icon:"🍽️", tint:"#EEE8FB"},
  nap:     {label:"Nap",      icon:"😴", tint:"#E4ECF4"},
  nappy:   {label:"Nappy",    icon:"🧷", tint:"#EDE6F4"},
  activity:{label:"Activity", icon:"🧩", tint:"#E5F1E6"},
  mood:    {label:"Mood",     icon:"😊", tint:"#FBF1DC"},
  note:    {label:"Note",     icon:"📝", tint:"#F2ECE6"},
};
const COLOURS = ["#6C4AE2","#5B7B6F","#C26B4E","#9A7BB0","#D9A441","#5B9A8B"];

/* ---------- helpers ---------- */
const $ = (s,r=document)=>r.querySelector(s);
const app = $("#app");
const esc = s=>(s||"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmtTime = ts=>{ const d=ts?.toDate?ts.toDate():new Date(); return d.toLocaleTimeString("en-GB",{hour:"2-digit",minute:"2-digit"}); };
const fmtDate = ts=>{ const d=ts?.toDate?ts.toDate():new Date(); const t=new Date();
  if(d.toDateString()===t.toDateString())return"Today";
  return d.toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"}); };

/* ---------- state ---------- */
let state = {profile:null, settingId:null};
let subs = [];
const clearSubs = ()=>{ subs.forEach(u=>u&&u()); subs=[]; };

/* ============================================================
   AUTH GATE
   ============================================================ */
onAuthStateChanged(auth, async user=>{
  clearSubs();
  if(!user){ renderAuth(); return; }
  app.innerHTML=`<div class="spin"></div>`;
  const snap = await getDoc(doc(db,"users",user.uid));
  if(snap.exists()){
    state.profile=snap.data(); state.settingId=state.profile.settingId;
    state.profile.role==="minder" ? renderMinderHome() : renderParentHome();
  } else { renderOnboarding(user); }
});

/* ============================================================
   AUTH SCREEN
   ============================================================ */
function renderAuth(mode="in"){
  app.innerHTML=`
    <div class="splash fade">
      <div class="mark">🪺</div>
      <h1 style="font-size:42px">LittleNest</h1>
      <p class="muted" style="margin:4px 0 36px">The warm little app for childminders &amp; families</p>
      <div id="err"></div>
      ${mode==="up"?`<input id="name" placeholder="Your name" autocomplete="name"><div style="height:12px"></div>`:""}
      <input id="email" type="email" placeholder="Email" autocomplete="email">
      <div style="height:12px"></div>
      <input id="pw" type="password" placeholder="Password" autocomplete="${mode==="up"?"new-password":"current-password"}">
      <div style="height:18px"></div>
      <button class="btn btn-primary" id="go">${mode==="up"?"Create account":"Sign in"}</button>
      <button class="btn btn-ghost" id="swap">${mode==="up"?"I already have an account":"Create a new account"}</button>
    </div>`;
  $("#swap").onclick=()=>renderAuth(mode==="up"?"in":"up");
  $("#go").onclick=async()=>{
    const email=$("#email").value.trim().toLowerCase(), pw=$("#pw").value;
    try{
      if(mode==="up"){ const c=await createUserWithEmailAndPassword(auth,email,pw);
        const nm=$("#name").value.trim(); if(nm) await updateProfile(c.user,{displayName:nm});
      } else { await signInWithEmailAndPassword(auth,email,pw); }
    }catch(e){ $("#err").innerHTML=`<div class="err">${esc(prettyErr(e))}</div>`; }
  };
}
function prettyErr(e){
  const m=(e.code||"").replace("auth/","");
  return({"invalid-email":"That email doesn't look right.","weak-password":"Password needs to be at least 6 characters.",
    "email-already-in-use":"That email already has an account — try signing in.",
    "invalid-credential":"Email or password not recognised.",
    "invalid-login-credentials":"Email or password not recognised."}[m])||e.message;
}

/* ============================================================
   ONBOARDING (REWRITTEN FOR INVITE CODE LOOKUP)
   ============================================================ */
function renderOnboarding(user){
  app.innerHTML=`
    <div class="splash fade">
      <div class="mark">🪺</div>
      <h1 style="font-size:34px">Welcome</h1>
      <p class="muted" style="margin:4px 0 32px">How will you use LittleNest?</p>
      <button class="btn btn-primary" id="minder">I'm a childminder<span style="display:block;font-size:12px;font-weight:600;opacity:.9">Set up my setting</span></button>
      <button class="btn btn-ghost" id="parent">I'm a parent<span style="display:block;font-size:12px;font-weight:600;color:var(--sub)">Link to my child</span></button>
      <button class="btn btn-ghost" id="out" style="margin-top:18px;color:var(--sub)">Sign out</button>
    </div>`;
  $("#out").onclick=()=>signOut(auth);
  $("#minder").onclick=()=>{
    app.innerHTML=`
      <div class="splash fade">
        <h2 style="font-size:28px">Name your setting</h2>
        <p class="muted" style="margin:6px 0 22px">e.g. Francesca Minskip Childminding</p>
        <input id="sn" placeholder="Setting name">
        <div style="height:16px"></div>
        <button class="btn btn-primary" id="create">Create setting</button>
      </div>`;
    $("#create").onclick=async()=>{
      const name=$("#sn").value.trim(); if(!name)return;
      const ref=await addDoc(collection(db,"settings"),{name,minderUid:user.uid,createdAt:serverTimestamp()});
      await setDoc(doc(db,"users",user.uid),{role:"minder",name:user.displayName||"",email:user.email,settingId:ref.id});
      state.profile={role:"minder",settingId:ref.id}; state.settingId=ref.id;
      renderMinderHome();
    };
  };
  
  // Re-routed parent logic to code entry to prevent the global query hang
  $("#parent").onclick=()=>renderParentLinkInterface(user);
}

function renderParentLinkInterface(user, errorMsg = null) {
  app.innerHTML=`
    <div class="splash fade">
      <h2 style="font-size:26px">Link to your child</h2>
      <p class="muted" style="margin:10px 0 22px;line-height:1.5">Enter the setup link code provided by your childminder below.</p>
      <div id="parent-err">${errorMsg ? `<div class="err">${esc(errorMsg)}</div>` : ''}</div>
      <input id="invcode" placeholder="e.g. LN-X4A2" style="text-align:center;font-family:monospace;font-size:20px;letter-spacing:2px;text-transform:uppercase;">
      <div style="height:16px"></div>
      <button class="btn btn-primary" id="claimcode">Verify &amp; Link Profile</button>
      <button class="btn btn-ghost" id="out2" style="color:var(--sub)">Sign out</button>
    </div>`;
    
  $("#out2").onclick=()=>signOut(auth);
  $("#claimcode").onclick=async()=>{
    const code = $("#invcode").value.trim().toUpperCase();
    if(!code) return;
    
    app.innerHTML=`<div class="spin"></div>`;
    try {
      const inviteRef = doc(db, "invites", code);
      const inviteSnap = await getDoc(inviteRef);
      
      if(!inviteSnap.exists()) {
        renderParentLinkInterface(user, "Code not found. Please double-check it.");
        return;
      }
      
      const inviteData = inviteSnap.data();
      if(inviteData.status === "used") {
        renderParentLinkInterface(user, "This setup code has already been used.");
        return;
      }
      
      const email = (user.email||"").toLowerCase();
      const settingId = inviteData.settingId;
      const childId = inviteData.childId;
      
      // Update child's profile directly
      const childRef = doc(db, "settings", settingId, "children", childId);
      await updateDoc(childRef, {
        parentUids: arrayUnion(user.uid),
        parentEmails: arrayUnion(email)
      });
      
      // Mark the code as burnt
      await updateDoc(inviteRef, {
        status: "used",
        usedBy: user.uid,
        usedAt: serverTimestamp()
      });
      
      // Complete user mapping
      const childIds = [childId];
      await setDoc(doc(db,"users",user.uid),{role:"parent",name:user.displayName||"",email,settingId,childIds});
      state.profile={role:"parent",settingId,childIds}; state.settingId=settingId;
      renderParentHome();
      
    } catch(e) {
      renderParentLinkInterface(user, e.message);
    }
  };
}

/* ============================================================
   MINDER HOME
   ============================================================ */
function renderMinderHome(){
  clearSubs();
  app.innerHTML=`
    <div class="topbar">
      <button class="back" id="out">Sign out</button>
      <h1 style="font-size:30px;color:var(--violet);margin-top:6px">Today</h1>
      <p class="muted" style="margin:2px 0 0;font-weight:600" id="sub">Loading…</p>
    </div>
    <div class="screen" style="padding-top:6px" id="list"><div class="spin"></div></div>
    <button class="fab" id="add">＋ Add child</button>`;
  $("#out").onclick=()=>signOut(auth);
  $("#add").onclick=openAddChild;
  const q=query(collection(db,"settings",state.settingId,"children"),orderBy("createdAt"));
  subs.push(onSnapshot(q,snap=>{
    $("#sub").textContent=`${snap.size} ${snap.size===1?"child":"children"}`;
    if(snap.empty){ $("#list").innerHTML=`<p class="muted center" style="padding:40px 0">No children yet.<br>Tap "Add child" to begin.</p>`; return; }
    $("#list").innerHTML=snap.docs.map(d=>{
      const c=d.data();
      return `<button class="card row fade" style="width:100%;padding:13px;border:1px solid var(--line);background:#fff;text-align:left" data-id="${d.id}">
        <div class="avatar" style="background:${c.colour||'#6C4AE2'}">${esc((c.name||"?")[0])}</div>
        <div style="flex:1">
          <div style="font-weight:800;font-size:17px">${esc(c.name)}</div>
          <div class="muted" style="font-size:13px">${esc(c.dob||"")}</div>
          ${c.setupCode ? `<div style="font-family:monospace;font-size:11px;color:var(--gold);margin-top:2px;font-weight:700">Code: ${esc(c.setupCode)}</div>` : ''}
        </div>
        <span class="muted" style="font-size:22px">›</span></button>`;
    }).join("");
    $("#list").querySelectorAll("[data-id]").forEach(b=>b.onclick=()=>{
      const d=snap.docs.find(x=>x.id===b.dataset.id);
      openChild(b.dataset.id,d.data(),true);
    });
  },err=>{ $("#list").innerHTML=`<p class="err">${esc(err.message)}</p>`; }));
}

function openAddChild(){
  const sheet=mountSheet("Add a child",`
    <input id="cn" placeholder="Child's name">
    <div style="height:12px"></div>
    <input id="dob" placeholder="Age or date of birth — e.g. 2y 4m">
    <div style="height:14px"></div>
    <p class="muted" style="font-size:12px;margin:4px 0 18px;line-height:1.4">Saving will automatically generate a clean link setup code you can hand directly to the parent.</p>
    <button class="btn btn-primary" id="save">Add child &amp; Generate Code</button>`);
    
  $("#save").onclick=async()=>{
    const name=$("#cn").value.trim(); if(!name)return;
    $("#save".disabled)=true;
    
    // Generate simple clean 6 character key
    const randSegment = Math.random().toString(36).substring(2,6).toUpperCase();
    const setupCode = `LN-${randSegment}`;
    const colour=COLOURS[Math.floor(Math.random()*COLOURS.length)];
    
    // 1. Add child record
    const childRef = await addDoc(collection(db,"settings",state.settingId,"children"),{
      name,dob:$("#dob").value.trim(),colour,parentEmails:[],parentUids:[],setupCode,createdAt:serverTimestamp()
    });
    
    // 2. Set the global look-up code mapping document
    await setDoc(doc(db, "invites", setupCode), {
      settingId: state.settingId,
      childId: childRef.id,
      childName: name,
      status: "pending",
      createdAt: serverTimestamp()
    });
    
    sheet.remove();
  };
}

/* ============================================================
   PARENT HOME
   ============================================================ */
async function renderParentHome(){
  clearSubs();
  app.innerHTML=`<div class="spin"></div>`;
  const ids=state.profile.childIds||[];
  const kids=[];
  for(const id of ids){
    const s=await getDoc(doc(db,"settings",state.settingId,"children",id));
    if(s.exists()) kids.push({id,...s.data()});
  }
  if(kids.length===1){ openChild(kids[0].id,kids[0],false); return; }
  app.innerHTML=`
    <div class="topbar"><button class="back" id="out">Sign out</button>
      <h1 style="font-size:30px;color:var(--violet);margin-top:6px">Your children</h1></div>
    <div class="screen" style="padding-top:6px" id="list"></div>`;
  $("#out").onclick=()=>signOut(auth);
  $("#list").innerHTML=kids.map(c=>`
    <button class="card row" style="width:100%;padding:13px;border:1px solid var(--line);background:#fff;text-align:left" data-id="${c.id}">
      <div class="avatar" style="background:${c.colour||'#6C4AE2'}">${esc((c.name||"?")[0])}</div>
      <div style="flex:1"><div style="font-weight:800;font-size:17px">${esc(c.name)}</div></div>
      <span clas
